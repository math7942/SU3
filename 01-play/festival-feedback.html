<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체험 소감 · 수수의 수학</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #b34fe0 0%, #7b3fa0 100%);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            position: relative;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 1160px;
            width: 100%;
        }

        .reset-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #fecaca;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #b34fe0 0%, #7b3fa0 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        h1 {
            color: #1e293b;
            margin: 0 0 8px 0;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #b34fe0 0%, #7b3fa0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #64748b;
            font-size: 1rem;
            margin: 8px 0 0 0;
            line-height: 1.6;
            word-break: keep-all;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card.active {
            background: linear-gradient(135deg, #b34fe0 0%, #7b3fa0 100%);
            color: white;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .feedback-list {
            display: grid;
            gap: 12px;
        }

        .feedback-card {
            padding: 18px 20px;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #b34fe0;
        }

        .feedback-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .feedback-name {
            font-weight: 700;
            color: #7b3fa0;
            font-size: 0.95rem;
        }

        .feedback-time {
            color: #94a3b8;
            font-size: 0.8rem;
        }

        .feedback-text {
            margin: 0;
            color: #334155;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .auto-refresh {
            position: fixed;
            bottom: 20px;
            right: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .refresh-animation {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #7b3fa0;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 4px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: #e2e8f0;
            color: #334155;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-button:hover {
            background: #cbd5e1;
        }

        @media (max-width: 768px) {
            .container { padding: 24px; }
            .reset-btn { position: static; margin: 0 0 16px auto; display: flex; width: max-content; }
            h1 { font-size: 1.8rem; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="reset-btn" onclick="resetRecords()">🧹 기록 초기화</button>

        <a href="gwangju-festival/index.html" class="back-button">← 돌아가기</a>

        <div class="header">
            <div class="badge">💬 2026 광주수학축제</div>
            <h1>체험 소감</h1>
            <p class="subtitle">[3단계] 4개의 숫자를 맞춰라!!! · 모든 참가자의 이야기</p>
        </div>

        <!-- 통계 -->
        <div class="stats-grid">
            <div class="stat-card active">
                <div class="stat-number" id="totalRecords">0</div>
                <div class="stat-label">등록된 소감</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="latestName">-</div>
                <div class="stat-label">최근 작성자</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="updateTime">방금 전</div>
                <div class="stat-label">마지막 업데이트</div>
            </div>
        </div>

        <!-- 소감 목록 -->
        <h2 style="color: #334155; margin-top: 0;">📝 참가자들의 이야기</h2>
        <div class="feedback-list" id="feedbackList">
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <p>아직 등록된 소감이 없습니다.</p>
            </div>
        </div>
    </div>

    <div class="auto-refresh">
        <span class="refresh-animation"></span>
        <div>자동 새로고침</div>
    </div>

    <script>
        const RESET_PASSWORD = '3.141592';

        // 기록 초기화 (비밀번호 확인)
        function resetRecords() {
            const input = prompt('🔒 기록을 모두 초기화하려면 비밀번호를 입력하세요.');
            if (input === null) return;

            if (input.trim() === RESET_PASSWORD) {
                localStorage.removeItem('handwritingRecords');
                localStorage.removeItem('matrixFilterHallOfFame');
                localStorage.removeItem('blendRecords');
                localStorage.removeItem('festivalFeedback');
                alert('✅ 모든 기록이 초기화되었습니다.');
                loadAllData();
            } else {
                alert('❌ 비밀번호가 일치하지 않습니다.');
            }
        }

        // 데이터 로드
        function loadAllData() {
            updateUI();
        }

        // UI 업데이트
        function updateUI() {
            const records = JSON.parse(localStorage.getItem('festivalFeedback')) || [];

            document.getElementById('totalRecords').textContent = records.length;
            document.getElementById('latestName').textContent = records.length ? (records[0].name || '익명') : '-';
            document.getElementById('updateTime').textContent = '방금 전';

            updateFeedbackList(records);
        }

        // 사용자가 입력한 텍스트(이름, 소감 등)를 안전하게 이스케이프
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 소감 목록
        function updateFeedbackList(records) {
            const container = document.getElementById('feedbackList');

            if (records.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>아직 등록된 소감이 없습니다.</p></div>';
                return;
            }

            container.innerHTML = records.slice(0, 50).map((r) => {
                const name = escapeHtml(r.name || '익명');
                const text = escapeHtml(r.text || '');

                return `
                    <div class="feedback-card">
                        <div class="feedback-head">
                            <span class="feedback-name">🙋 ${name}</span>
                            <span class="feedback-time">${r.timestamp}</span>
                        </div>
                        <p class="feedback-text">${text}</p>
                    </div>
                `;
            }).join('');
        }

        // 자동 새로고침
        setInterval(() => {
            loadAllData();
        }, 3000);

        // 초기화
        window.addEventListener('load', () => {
            loadAllData();
        });

        // 다른 탭에서 데이터 변경 시 감지
        window.addEventListener('storage', () => {
            loadAllData();
        });
    </script>
</body>
</html>
