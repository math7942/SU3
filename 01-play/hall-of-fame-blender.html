<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행렬 연금술사 명예의 전당 · 수수의 수학</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #5b8cff 0%, #3c63d6 100%);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            position: relative;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 1160px;
            width: 100%;
        }

        .reset-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #fecaca;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #5b8cff 0%, #3c63d6 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        h1 {
            color: #1e293b;
            margin: 0 0 8px 0;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #5b8cff 0%, #3c63d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #64748b;
            font-size: 1rem;
            margin: 8px 0 0 0;
            line-height: 1.6;
            word-break: keep-all;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card.active {
            background: linear-gradient(135deg, #5b8cff 0%, #3c63d6 100%);
            color: white;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .rank-list {
            display: grid;
            gap: 12px;
        }

        .rank-item {
            display: grid;
            grid-template-columns: 80px 1fr 150px;
            gap: 16px;
            align-items: center;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #e2e8f0;
            transition: all 0.2s;
        }

        .rank-item:hover {
            background: #eff3ff;
            border-left-color: #3c63d6;
        }

        .rank-item.gold {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-left-color: #fbbf24;
        }

        .rank-item.silver {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            border-left-color: #d1d5db;
        }

        .rank-item.bronze {
            background: linear-gradient(135deg, #fed7aa 0%, #fdba74 100%);
            border-left-color: #fb923c;
        }

        .rank-medal {
            font-size: 2.5rem;
            text-align: center;
        }

        .rank-info h4 {
            margin: 0 0 4px 0;
            color: #1e293b;
            font-size: 0.95rem;
        }

        .rank-info p {
            margin: 0;
            color: #64748b;
            font-size: 0.85rem;
        }

        .rank-time {
            text-align: right;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .blend-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .blend-thumb {
            width: 72px;
            height: 54px;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            background: white;
            object-fit: cover;
            flex: none;
        }

        .blend-value {
            background: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: #3c63d6;
            border: 1px solid #e2e8f0;
        }

        .auto-refresh {
            position: fixed;
            bottom: 20px;
            right: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .refresh-animation {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #3c63d6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 4px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: #e2e8f0;
            color: #334155;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-button:hover {
            background: #cbd5e1;
        }

        .cross-nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        .cross-nav a {
            flex: 1;
            min-width: 220px;
            text-align: center;
            padding: 14px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: transform 0.15s ease;
        }

        .cross-nav a:hover {
            transform: translateY(-2px);
        }

        .cross-nav .to-handwriting {
            background: #e0f2fe;
            color: #0c4a6e;
            border: 1px solid #bae6fd;
        }

        .cross-nav .to-feedback {
            background: #f6e6ff;
            color: #5b21b6;
            border: 1px solid #e4c9ff;
        }

        @media (max-width: 768px) {
            .container { padding: 24px; }
            .reset-btn { position: static; margin: 0 0 16px auto; display: flex; width: max-content; }
            h1 { font-size: 1.8rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .rank-item { grid-template-columns: 60px 1fr; }
            .rank-time { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="reset-btn" onclick="resetRecords()">🧹 기록 초기화</button>

        <a href="gwangju-festival/index.html" class="back-button">← 돌아가기</a>

        <div class="header">
            <div class="badge">🧪 2026 광주수학축제</div>
            <h1>행렬 연금술사 명예의 전당</h1>
            <p class="subtitle">[2단계] 행렬 연금술사!! · 모든 참가자의 작품</p>
        </div>

        <!-- 통계 -->
        <div class="stats-grid">
            <div class="stat-card active">
                <div class="stat-number" id="totalRecords">0</div>
                <div class="stat-label">등록된 작품</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="latestName">-</div>
                <div class="stat-label">최근 참가자</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="updateTime">방금 전</div>
                <div class="stat-label">마지막 업데이트</div>
            </div>
        </div>

        <!-- 행렬 연금술사 랭킹 -->
        <h2 style="color: #334155; margin-top: 0;">🎪 최고의 밈 제작자 TOP 10</h2>
        <div class="rank-list" id="blendRanking">
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <p>아직 등록된 작품이 없습니다.</p>
            </div>
        </div>

        <div class="cross-nav">
            <a class="to-handwriting" href="hall-of-fame.html">✍️ AI를 속여라 명예의 전당 →</a>
            <a class="to-feedback" href="festival-feedback.html">💬 체험 소감 보기 →</a>
        </div>
    </div>

    <div class="auto-refresh">
        <span class="refresh-animation"></span>
        <div>자동 새로고침</div>
    </div>

    <script>
        const RESET_PASSWORD = '3.141592';

        // 기록 초기화 (비밀번호 확인)
        function resetRecords() {
            const input = prompt('🔒 기록을 모두 초기화하려면 비밀번호를 입력하세요.');
            if (input === null) return;

            if (input.trim() === RESET_PASSWORD) {
                localStorage.removeItem('handwritingRecords');
                localStorage.removeItem('matrixFilterHallOfFame');
                localStorage.removeItem('blendRecords');
                localStorage.removeItem('festivalFeedback');
                alert('✅ 모든 기록이 초기화되었습니다.');
                loadAllData();
            } else {
                alert('❌ 비밀번호가 일치하지 않습니다.');
            }
        }

        // 데이터 로드
        function loadAllData() {
            updateUI();
        }

        // UI 업데이트
        function updateUI() {
            const records = JSON.parse(localStorage.getItem('blendRecords')) || [];

            document.getElementById('totalRecords').textContent = records.length;
            document.getElementById('latestName').textContent = records.length ? (records[0].name || '익명') : '-';
            document.getElementById('updateTime').textContent = '방금 전';

            updateBlendRanking(records);
        }

        // 사용자가 입력한 텍스트(이름 등)를 안전하게 이스케이프
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 행렬 연금술사 랭킹
        function updateBlendRanking(records) {
            const container = document.getElementById('blendRanking');

            if (records.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>아직 등록된 작품이 없습니다.</p></div>';
                return;
            }

            container.innerHTML = records.slice(0, 10).map((r, idx) => {
                const medals = ['🥇', '🥈', '🥉'];
                const medal = idx < 3 ? medals[idx] : `${idx + 1}`;
                const classes = idx === 0 ? 'rank-item gold' : idx === 1 ? 'rank-item silver' : idx === 2 ? 'rank-item bronze' : 'rank-item';
                const name = escapeHtml(r.name || '익명');
                const thumb = r.image
                    ? `<img class="blend-thumb" src="${r.image}" alt="${name}님의 합성 작품">`
                    : '';

                return `
                    <div class="${classes}">
                        <div class="rank-medal">${medal}</div>
                        <div class="rank-info">
                            <h4>${name}님의 작품</h4>
                            <div class="blend-row">
                                ${thumb}
                                <p style="margin: 0;">
                                    <span class="blend-value">${r.alpha}%</span>
                                    이미지1 +
                                    <span class="blend-value">${r.beta}%</span>
                                    이미지2
                                </p>
                            </div>
                        </div>
                        <div class="rank-time">${r.timestamp}</div>
                    </div>
                `;
            }).join('');
        }

        // 자동 새로고침
        setInterval(() => {
            loadAllData();
        }, 3000);

        // 초기화
        window.addEventListener('load', () => {
            loadAllData();
        });

        // 다른 탭에서 데이터 변경 시 감지
        window.addEventListener('storage', () => {
            loadAllData();
        });
    </script>
</body>
</html>
