<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행렬 연금술사!! · 수수의 수학</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 1160px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .badge {
            display: inline-block;
            background: #f5576c;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        h1 {
            color: #1e293b;
            margin: 0 0 8px 0;
            font-size: 2rem;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin: 8px 0 0 0;
            line-height: 1.6;
            word-break: keep-all;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .image-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .image-section h3 {
            color: #334155;
            margin: 0;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .image-container {
            border: 3px dashed #cbd5e1;
            border-radius: 12px;
            padding: 12px;
            background: #f8fafc;
            text-align: center;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .image-container canvas,
        .image-container img,
        .image-container video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-file {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: #f0f4ff;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            color: #334155;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-file:hover {
            border-color: #f5576c;
            background: #fff5f7;
        }

        input[type="file"] {
            display: none;
        }

        .webcam-buttons {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-primary {
            background: #f5576c;
            color: white;
            flex: 1;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.2);
        }

        .btn-primary:hover {
            background: #e83e57;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        /* 컨트롤 패널 */
        .control-panel {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .control-panel h3 {
            color: #334155;
            margin: 0 0 16px 0;
            font-size: 1rem;
            font-weight: 600;
        }

        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-item label {
            color: #334155;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #cbd5e1;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #f5576c;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(245, 87, 108, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #f5576c;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(245, 87, 108, 0.3);
        }

        .value-display {
            min-width: 50px;
            text-align: center;
            color: #f5576c;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .formula-box {
            background: white;
            border-left: 4px solid #f5576c;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #334155;
            line-height: 1.6;
            margin-top: 8px;
        }

        /* 결과 영역 */
        .result-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-section h3 {
            color: #334155;
            margin: 0;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .result-container {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            background: #f8fafc;
            text-align: center;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-container canvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .info-box {
            background: #fff5f7;
            border-left: 4px solid #f5576c;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #334155;
            margin-bottom: 12px;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .preset-btn {
            padding: 10px;
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: #334155;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            border-color: #f5576c;
            background: #fff5f7;
        }

        .hint-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #334155;
            margin-top: 12px;
        }

        @media (max-width: 768px) {
            .container { padding: 24px; }
            h1 { font-size: 1.5rem; }
            .main-grid { grid-template-columns: 1fr; }
            .control-group { grid-template-columns: 1fr; }
            .preset-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge">🎨 2026 광주수학축제</div>
            <h1>행렬 연금술사!!</h1>
        </div>

        <div class="info-box">
            💡 <strong>행렬 연금술이란?</strong> 두 이미지를 행렬 연산으로 합성합니다. A × α + B × (1-α) 공식으로 새로운 이미지를 만들어보세요!
        </div>

        <!-- 이미지 입력 영역 -->
        <div class="main-grid">
            <!-- 이미지 1 -->
            <div class="image-section">
                <h3>🖼️ 이미지 1 (예: 내 얼굴)</h3>
                <div class="image-container" id="container1">
                    <video id="webcam" autoplay muted playsinline style="display: none; transform: scaleX(-1); width: 100%; height: 100%; object-fit: cover;"></video>
                    <canvas id="canvas1" style="display: none;"></canvas>
                    <img id="img1" style="display: none;">
                    <div id="placeholder1" style="color: #94a3b8; text-align: center;">
                        <div style="font-size: 2rem; margin-bottom: 8px;">📷</div>
                        이미지를 업로드하거나 샘플을 선택하세요
                    </div>
                </div>
                <div class="upload-area">
                    <label class="btn-file">
                        📁 파일 업로드
                        <input type="file" id="file1" accept="image/*">
                    </label>
                    <div class="preset-buttons">
                        <button class="preset-btn" onclick="loadSampleImage1('animal')">☀️ 해</button>
                        <button class="preset-btn" onclick="loadSampleImage1('face')">🎵 음악노트</button>
                        <button class="preset-btn" onclick="loadSampleImage1('pattern')">⭐ 별</button>
                        <button class="preset-btn" onclick="loadSampleImage1('meme')">⛵ 배</button>
                    </div>
                    <div class="webcam-buttons">
                        <button class="btn-primary" id="startWebcam" onclick="startWebcam()">📷 웹캠 켜기</button>
                        <button class="btn-secondary" id="captureWebcam" onclick="captureWebcam()" style="display: none;">✓ 촬영</button>
                    </div>
                    <div id="cameraSelectWrap" style="display: none; margin-top: 8px;">
                        <label for="cameraSelect" style="display: block; margin-bottom: 4px; font-size: 0.8rem; color: #64748b;">카메라 선택 (화면이 검게 나오면 다른 카메라를 선택해보세요)</label>
                        <select id="cameraSelect" onchange="switchWebcamDevice()" style="width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.85rem; font-family: inherit; color: #334155;"></select>
                    </div>
                </div>
            </div>

            <!-- 이미지 2 -->
            <div class="image-section">
                <h3>🦁 이미지 2 (예: 동물/밈)</h3>
                <div class="image-container" id="container2">
                    <img id="img2" style="display: none;">
                    <div id="placeholder2" style="color: #94a3b8; text-align: center;">
                        <div style="font-size: 2rem; margin-bottom: 8px;">🎭</div>
                        이미지를 업로드하거나 샘플을 선택하세요
                    </div>
                </div>
                <div class="upload-area">
                    <label class="btn-file">
                        📁 파일 업로드
                        <input type="file" id="file2" accept="image/*">
                    </label>
                    <div class="preset-buttons">
                        <button class="preset-btn" onclick="loadSampleImage('animal')">🌈 무지개</button>
                        <button class="preset-btn" onclick="loadSampleImage('face')">🎶 음표들</button>
                        <button class="preset-btn" onclick="loadSampleImage('pattern')">🌙 달</button>
                        <button class="preset-btn" onclick="loadSampleImage('meme')">🌊 바다</button>
                    </div>
                    <div class="hint-box">
                        <strong>💡 팁:</strong> 같은 크기의 이미지를 사용하면 더 좋은 결과가 나옵니다!
                    </div>
                </div>
            </div>
        </div>

        <!-- 컨트롤 패널 -->
        <div class="control-panel">
            <h3>⚙️ 합성 비율 설정</h3>

            <div class="control-group">
                <div class="control-item">
                    <label>이미지 1의 가중치 (A)</label>
                    <div class="slider-container">
                        <input type="range" id="alphaSlider" min="0" max="100" value="50" step="1">
                        <span class="value-display" id="alphaValue">50%</span>
                    </div>
                </div>
                <div class="control-item">
                    <label>이미지 2의 가중치 (B)</label>
                    <div class="slider-container">
                        <input type="range" id="betaSlider" min="0" max="100" value="50" step="1" disabled>
                        <span class="value-display" id="betaValue">50%</span>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <div class="control-item">
                    <label>빠른 설정</label>
                    <div class="preset-buttons">
                        <button class="preset-btn" onclick="setBlend(20)">🔵 이미지 1 강조 (20%)</button>
                        <button class="preset-btn" onclick="setBlend(50)">⚪ 완벽한 혼합 (50%)</button>
                        <button class="preset-btn" onclick="setBlend(80)">🔴 이미지 2 강조 (80%)</button>
                        <button class="preset-btn" onclick="setBlend(100)">🌈 무작위 섞임</button>
                    </div>
                </div>
            </div>

            <div class="formula-box">
                결과 = 이미지1 × <span id="alphaDisplay">0.50</span> + 이미지2 × <span id="betaDisplay">0.50</span>
            </div>
        </div>

        <!-- 결과 영역 -->
        <div class="result-section">
            <h3>✨ 합성 결과</h3>
            <div class="result-container">
                <canvas id="resultCanvas" width="400" height="300"></canvas>
            </div>
            <div id="hallNameWrap" style="display: none; margin-bottom: 10px;">
                <label for="hallName" style="display: block; margin-bottom: 6px; font-size: 0.85rem; color: #334155; font-weight: 600;">🙋 이름 또는 한마디</label>
                <input type="text" id="hallName" placeholder="이름 또는 한마디 (입력 안 하면 '익명')" maxlength="20" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 1rem; font-family: inherit; color: #334155;">
            </div>
            <div class="button-group">
                <button class="btn-primary" id="downloadBtn" onclick="downloadResult()" disabled>
                    💾 결과 다운로드
                </button>
                <button class="btn-secondary" id="saveHallBtn" onclick="saveToHallOfFame()" style="display: none;">
                    🏆 명예의 전당 등록
                </button>
                <button class="btn-secondary" onclick="resetAll()">🔄 초기화</button>
            </div>
        </div>
    </div>

    <script>
        let img1 = null;
        let img2 = null;
        let webcamActive = false;
        let canvasStream = null;

        // 파일 업로드 처리
        document.getElementById('file1').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const image = new Image();
                    image.onload = () => {
                        img1 = image;
                        displayImage(image, 'container1', 'img1', 'placeholder1');
                        if (webcamActive) stopWebcam();
                        updateBlend();
                    };
                    image.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('file2').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const image = new Image();
                    image.onload = () => {
                        img2 = image;
                        displayImage(image, 'container2', 'img2', 'placeholder2');
                        updateBlend();
                    };
                    image.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // 샘플 이미지 로드
        function loadSampleImage(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            if (type === 'animal') {
                // 아름다운 무지개 🌈
                // 밝은 하늘 배경
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 400, 300);

                // 무지개 색상들
                const rainbowColors = [
                    '#ff0000',  // 빨강
                    '#ff7f00',  // 주황
                    '#ffff00',  // 노랑
                    '#00ff00',  // 초록
                    '#0000ff',  // 파랑
                    '#4b0082',  // 남색
                    '#9400d3'   // 보라
                ];

                // 무지개 중심점과 반지름
                const centerX = 200;
                const centerY = 280;
                const maxRadius = 150;

                // 각 색상별 호 그리기
                rainbowColors.forEach((color, index) => {
                    const radius = maxRadius - (index * 20);
                    const lineWidth = 22;

                    ctx.strokeStyle = color;
                    ctx.lineWidth = lineWidth;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, Math.PI, 0, false);
                    ctx.stroke();
                });

                // 무지개 아래 그림자 효과 (약간의 투명도)
                const shadowGradient = ctx.createLinearGradient(centerX, 150, centerX, 300);
                shadowGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
                shadowGradient.addColorStop(1, 'rgba(0, 0, 0, 0.1)');
                ctx.fillStyle = shadowGradient;
                ctx.fillRect(50, 150, 300, 150);
            } else if (type === 'face') {
                // 밝은 배경
                ctx.fillStyle = '#f9f9f9';
                ctx.fillRect(0, 0, 400, 300);

                // 음표 그리기 함수 (제대로 된 음표 모양)
                function drawNote(x, y, scale) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.scale(scale, scale);

                    // 음표 헤드 (타원, 기울임)
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 12, 14, -0.25, 0, Math.PI * 2);
                    ctx.fill();

                    // 음표 줄기 (stem)
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(12, -8);
                    ctx.lineTo(12, -50);
                    ctx.stroke();

                    // 음표 깃발 (flag) - 매끄러운 곡선
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.moveTo(12, -50);
                    ctx.bezierCurveTo(25, -48, 28, -40, 12, -35);
                    ctx.fill();

                    ctx.restore();
                }

                // 여러 음표 배치 (악보처럼 배치)
                const notes = [
                    { x: 40, y: 80, scale: 1 },
                    { x: 90, y: 100, scale: 0.9 },
                    { x: 140, y: 70, scale: 1.1 },
                    { x: 190, y: 90, scale: 1 },
                    { x: 240, y: 110, scale: 0.95 },
                    { x: 290, y: 75, scale: 1.05 },
                    { x: 340, y: 95, scale: 1 },
                    { x: 60, y: 160, scale: 1.05 },
                    { x: 120, y: 180, scale: 0.95 },
                    { x: 200, y: 150, scale: 1.1 },
                    { x: 280, y: 170, scale: 1 },
                    { x: 340, y: 190, scale: 0.9 },
                ];

                notes.forEach(note => drawNote(note.x, note.y, note.scale));
            } else if (type === 'pattern') {
                // 달만 있는 밤 하늘
                ctx.fillStyle = '#001a4d';
                ctx.fillRect(0, 0, 400, 300);

                // 달
                ctx.fillStyle = '#fffacd';
                ctx.beginPath();
                ctx.arc(350, 80, 40, 0, Math.PI * 2);
                ctx.fill();

                // 달 크레이터
                ctx.fillStyle = '#e0e0c0';
                ctx.beginPath();
                ctx.arc(330, 70, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(360, 100, 6, 0, Math.PI * 2);
                ctx.fill();
            } else if (type === 'meme') {
                // 바다 배경 (그라데이션으로 깊이감)
                const oceanGradient = ctx.createLinearGradient(0, 0, 0, 300);
                oceanGradient.addColorStop(0, '#4a9fd8');
                oceanGradient.addColorStop(0.5, '#2b7ab5');
                oceanGradient.addColorStop(1, '#1a4d7f');
                ctx.fillStyle = oceanGradient;
                ctx.fillRect(0, 0, 400, 300);

                // 파도 그리기 (더 현실적인 모양)
                function drawWave(startY, amplitude, frequency, darkColor, lightColor) {
                    ctx.fillStyle = darkColor;
                    ctx.beginPath();
                    ctx.moveTo(0, startY);
                    for (let x = 0; x <= 400; x += 10) {
                        const y = startY + Math.sin(x / frequency) * amplitude + Math.cos(x / frequency * 0.5) * (amplitude * 0.3);
                        ctx.lineTo(x, y);
                    }
                    ctx.lineTo(400, 300);
                    ctx.lineTo(0, 300);
                    ctx.closePath();
                    ctx.fill();

                    // 파도 테두리 (화이트 캡)
                    ctx.strokeStyle = lightColor;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    for (let x = 0; x <= 400; x += 10) {
                        const y = startY + Math.sin(x / frequency) * amplitude + Math.cos(x / frequency * 0.5) * (amplitude * 0.3);
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }

                // 여러 층의 파도
                drawWave(120, 15, 60, '#2b7ab5', '#a8d8ff');
                drawWave(160, 12, 80, '#1f5a8a', '#7cc7ff');
                drawWave(200, 10, 70, '#1a4d7f', '#5eb3ff');
                drawWave(240, 8, 90, '#0f3a5c', '#4da6ff');
            }

            const image = new Image();
            image.onload = () => {
                img2 = image;
                displayImage(image, 'container2', 'img2', 'placeholder2');
                updateBlend();
            };
            image.src = canvas.toDataURL();
        }

        // 이미지 1용 샘플 이미지 로드
        function loadSampleImage1(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            if (type === 'animal') {
                // 밝은 해 ☀️ (오른쪽 상단에 작게)
                // 배경 (하늘색)
                ctx.fillStyle = '#87ceeb';
                ctx.fillRect(0, 0, 400, 300);

                // 해 (태양) - 작은 크기, 오른쪽 상단
                const sunX = 330;
                const sunY = 70;
                const sunRadius = 35;

                const sunGradient = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, sunRadius);
                sunGradient.addColorStop(0, '#ffeb3b');
                sunGradient.addColorStop(0.8, '#fdd835');
                sunGradient.addColorStop(1, '#fb8c00');
                ctx.fillStyle = sunGradient;
                ctx.beginPath();
                ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
                ctx.fill();

                // 햇빛 광선 (작은 해에 맞게 조정)
                ctx.strokeStyle = '#ffb300';
                ctx.lineWidth = 4;
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const x1 = sunX + Math.cos(angle) * 55;
                    const y1 = sunY + Math.sin(angle) * 55;
                    const x2 = sunX + Math.cos(angle) * 80;
                    const y2 = sunY + Math.sin(angle) * 80;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }

                // 해의 중심 하이라이트
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.arc(sunX, sunY, 25, 0, Math.PI * 2);
                ctx.fill();

                // 해의 윤기
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(sunX - 15, sunY - 15, 12, 0, Math.PI * 2);
                ctx.fill();
            } else if (type === 'face') {
                // 오선지 배경
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, 400, 300);

                // 5줄 오선지 그리기
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                const staffTop = 80;
                const staffSpacing = 20;
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.moveTo(20, staffTop + i * staffSpacing);
                    ctx.lineTo(380, staffTop + i * staffSpacing);
                    ctx.stroke();
                }
            } else if (type === 'pattern') {
                // 별들
                ctx.fillStyle = '#001a4d';
                ctx.fillRect(0, 0, 400, 300);

                ctx.fillStyle = '#fff';
                for (let i = 0; i < 50; i++) {
                    const x = Math.random() * 400;
                    const y = Math.random() * 300;
                    const size = Math.random() * 2;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (type === 'meme') {
                // 하늘 그라데이션
                const skyGradient = ctx.createLinearGradient(0, 0, 0, 200);
                skyGradient.addColorStop(0, '#87ceeb');
                skyGradient.addColorStop(1, '#b0d8f0');
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, 400, 200);

                // 수평선
                ctx.fillStyle = '#5a9fc8';
                ctx.fillRect(0, 200, 400, 1);

                // 물 부분 (파란색)
                ctx.fillStyle = '#4a8fc8';
                ctx.fillRect(0, 200, 400, 100);

                // 배 선체 (더 사실적인 모양)
                const hullGradient = ctx.createLinearGradient(120, 180, 120, 240);
                hullGradient.addColorStop(0, '#a0522d');
                hullGradient.addColorStop(1, '#6b3410');
                ctx.fillStyle = hullGradient;
                ctx.beginPath();
                ctx.moveTo(100, 200);
                ctx.lineTo(300, 200);
                ctx.bezierCurveTo(320, 205, 320, 220, 300, 240);
                ctx.lineTo(100, 240);
                ctx.bezierCurveTo(80, 220, 80, 205, 100, 200);
                ctx.fill();

                // 선체 테두리 (어두운색)
                ctx.strokeStyle = '#3d2817';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 선체 음영
                ctx.fillStyle = '#8b6f47';
                ctx.beginPath();
                ctx.moveTo(100, 200);
                ctx.lineTo(300, 200);
                ctx.lineTo(295, 210);
                ctx.lineTo(105, 210);
                ctx.closePath();
                ctx.fill();

                // 선체 창문 3개
                for (let windowX of [150, 200, 250]) {
                    ctx.fillStyle = '#4a7fa8';
                    ctx.beginPath();
                    ctx.arc(windowX, 215, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#2d3e50';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // 창 십자선
                    ctx.strokeStyle = '#2d3e50';
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(windowX - 3, windowX);
                    ctx.lineTo(windowX + 3, windowX);
                    ctx.moveTo(windowX, windowX - 3);
                    ctx.lineTo(windowX, windowX + 3);
                    ctx.stroke();
                }

                // 마스트 (돛대)
                const mastGradient = ctx.createLinearGradient(200, 50, 205, 200);
                mastGradient.addColorStop(0, '#a68860');
                mastGradient.addColorStop(1, '#6b5344');
                ctx.fillStyle = mastGradient;
                ctx.fillRect(198, 40, 4, 160);

                // 마스트 상단 (끝부분)
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(200, 40, 3, 0, Math.PI * 2);
                ctx.fill();

                // 큰 돛 (메인 세일) - 화이트 색상
                ctx.fillStyle = '#fffef0';
                ctx.beginPath();
                ctx.moveTo(200, 70);
                ctx.lineTo(290, 190);
                ctx.lineTo(180, 190);
                ctx.closePath();
                ctx.fill();

                // 큰 돛 테두리
                ctx.strokeStyle = '#d4af8c';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 큰 돛 주름
                ctx.strokeStyle = '#e8dcc8';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(210, 80);
                ctx.quadraticCurveTo(250, 120, 285, 185);
                ctx.stroke();

                // 작은 돛 (지브 세일) - 밝은 베이지
                ctx.fillStyle = '#f5f1e8';
                ctx.beginPath();
                ctx.moveTo(200, 85);
                ctx.lineTo(260, 185);
                ctx.lineTo(170, 185);
                ctx.closePath();
                ctx.fill();

                // 작은 돛 테두리
                ctx.strokeStyle = '#d4af8c';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 깃발 (선단 끝)
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.moveTo(200, 40);
                ctx.lineTo(250, 50);
                ctx.lineTo(200, 60);
                ctx.closePath();
                ctx.fill();

                // 깃발 테두리
                ctx.strokeStyle = '#cc0000';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 아래 물결 (배가 물을 가르는 효과)
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = 0.4;
                for (let waveX of [80, 320]) {
                    ctx.beginPath();
                    ctx.arc(waveX, 245, 20, 0, Math.PI, true);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            const image = new Image();
            image.onload = () => {
                img1 = image;
                displayImage(image, 'container1', 'img1', 'placeholder1');
                updateBlend();
            };
            image.src = canvas.toDataURL();
        }

        // 웹캠 함수들

        // 지정한 deviceId(없으면 기본 카메라)로 스트림을 열어 video에 연결
        async function openWebcamStream(deviceId) {
            if (canvasStream) {
                canvasStream.getTracks().forEach(track => track.stop());
            }

            const constraints = deviceId
                ? { video: { deviceId: { exact: deviceId }, width: { ideal: 400 }, height: { ideal: 300 } } }
                : { video: { facingMode: 'user', width: { ideal: 400 }, height: { ideal: 300 } } };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            const video = document.getElementById('webcam');
            // 속성뿐 아니라 프로퍼티로도 명시해야 일부 브라우저에서 자동재생이 확실히 동작함
            video.muted = true;
            video.playsInline = true;
            video.srcObject = stream;
            video.style.display = 'block';

            try {
                await video.play();
            } catch (playErr) {
                console.warn('video.play() 실패, 메타데이터 로드 후 재시도:', playErr);
                await new Promise((resolve) => {
                    video.addEventListener('loadedmetadata', resolve, { once: true });
                });
                await video.play();
            }

            canvasStream = stream;
        }

        // 카메라가 여러 개면 선택 드롭다운을 채움 (얼굴 인식용 IR 카메라가
        // 기본으로 잡혀 화면이 검게 나오는 노트북에서 다른 카메라로 바꿀 수 있게 함)
        async function populateCameraSelect() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cameras = devices.filter(d => d.kind === 'videoinput');
                const select = document.getElementById('cameraSelect');
                const wrap = document.getElementById('cameraSelectWrap');

                if (cameras.length < 2) {
                    wrap.style.display = 'none';
                    return;
                }

                select.innerHTML = cameras.map((cam, idx) =>
                    `<option value="${cam.deviceId}">${cam.label || `카메라 ${idx + 1}`}</option>`
                ).join('');

                const currentTrack = canvasStream && canvasStream.getVideoTracks()[0];
                const currentId = currentTrack && currentTrack.getSettings().deviceId;
                if (currentId) select.value = currentId;

                wrap.style.display = 'block';
            } catch (err) {
                console.warn('카메라 목록을 가져오지 못했습니다:', err);
            }
        }

        async function startWebcam() {
            try {
                await openWebcamStream();
                document.getElementById('placeholder1').style.display = 'none';
                document.getElementById('startWebcam').style.display = 'none';
                document.getElementById('captureWebcam').style.display = 'block';
                webcamActive = true;
                populateCameraSelect();
            } catch (err) {
                let errorMsg = `웹캠 접근 오류\n\n`;

                if (err.name === 'NotFoundError') {
                    errorMsg += `이 환경에서는 카메라를 사용할 수 없습니다.\n\n`;
                    errorMsg += `대신 다음 방법을 사용하세요:\n`;
                    errorMsg += `• 샘플 이미지 버튼으로 빠르게 시작\n`;
                    errorMsg += `• 파일 업로드로 원하는 이미지 사용`;
                } else if (err.name === 'NotAllowedError') {
                    errorMsg += `카메라 접근 권한을 거부했습니다.\n\n`;
                    errorMsg += `브라우저 권한 설정을 확인하거나\n`;
                    errorMsg += `파일 업로드 또는 샘플 이미지를 사용해주세요.`;
                } else {
                    errorMsg += `${err.name}: ${err.message}\n\n`;
                    errorMsg += `파일 업로드 또는 샘플 이미지를 사용해주세요.`;
                }

                alert(errorMsg);
                console.error('웹캠 에러:', err);
            }
        }

        // 드롭다운에서 다른 카메라를 고르면 그 카메라로 스트림을 다시 염
        async function switchWebcamDevice() {
            const deviceId = document.getElementById('cameraSelect').value;
            if (!deviceId) return;
            try {
                await openWebcamStream(deviceId);
            } catch (err) {
                alert(`카메라 전환 오류\n\n${err.name}: ${err.message}`);
                console.error('카메라 전환 에러:', err);
            }
        }

        function stopWebcam() {
            if (canvasStream) {
                canvasStream.getTracks().forEach(track => track.stop());
                document.getElementById('webcam').style.display = 'none';
                document.getElementById('placeholder1').style.display = 'block';
                document.getElementById('startWebcam').style.display = 'block';
                document.getElementById('captureWebcam').style.display = 'none';
                document.getElementById('cameraSelectWrap').style.display = 'none';
                webcamActive = false;
            }
        }

        function captureWebcam() {
            const video = document.getElementById('webcam');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0);

            const image = new Image();
            image.onload = () => {
                img1 = image;
                stopWebcam();
                displayImage(image, 'container1', 'img1', 'placeholder1');
                updateBlend();
            };
            image.src = canvas.toDataURL();
        }

        // 이미지 표시
        function displayImage(image, containerId, imgId, placeholderId) {
            const container = document.getElementById(containerId);
            const placeholder = document.getElementById(placeholderId);
            const imgElement = document.getElementById(imgId);

            imgElement.src = image.src;
            imgElement.style.display = 'block';
            placeholder.style.display = 'none';
        }

        // 합성 비율 업데이트
        document.getElementById('alphaSlider').addEventListener('input', (e) => {
            const alpha = parseInt(e.target.value);
            const beta = 100 - alpha;

            document.getElementById('alphaValue').textContent = alpha + '%';
            document.getElementById('betaValue').textContent = beta + '%';
            document.getElementById('alphaDisplay').textContent = (alpha / 100).toFixed(2);
            document.getElementById('betaDisplay').textContent = (beta / 100).toFixed(2);

            updateBlend();
        });

        // 빠른 설정
        function setBlend(value) {
            if (value === 100) {
                value = Math.floor(Math.random() * 101);
            }
            document.getElementById('alphaSlider').value = value;
            document.getElementById('alphaSlider').dispatchEvent(new Event('input'));
        }

        // 블렌딩 업데이트
        function updateBlend() {
            if (!img1 || !img2) {
                document.getElementById('downloadBtn').disabled = true;
                return;
            }

            const alpha = parseInt(document.getElementById('alphaSlider').value) / 100;
            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');

            // 캔버스 크기 조정 (더 큰 크기로)
            const targetWidth = Math.min(img1.width, img2.width, 400);
            const targetHeight = Math.min(img1.height, img2.height, 300);
            canvas.width = targetWidth;
            canvas.height = targetHeight;

            // 배경 채우기
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 이미지 1 그리기 (투명도 적용)
            ctx.globalAlpha = alpha;
            ctx.drawImage(img1, 0, 0, canvas.width, canvas.height);

            // 이미지 2 그리기 (투명도 적용)
            ctx.globalAlpha = 1 - alpha;
            ctx.drawImage(img2, 0, 0, canvas.width, canvas.height);

            ctx.globalAlpha = 1;
            document.getElementById('downloadBtn').disabled = false;
            document.getElementById('saveHallBtn').style.display = 'block';
            document.getElementById('hallNameWrap').style.display = 'block';
        }

        // 결과 다운로드
        function downloadResult() {
            const canvas = document.getElementById('resultCanvas');
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = '행렬연금술_' + new Date().getTime() + '.png';
            link.click();
        }

        // 합성 결과를 작은 썸네일 데이터 URL로 캡처
        function getBlendSnapshot(size) {
            const source = document.getElementById('resultCanvas');
            const snap = document.createElement('canvas');
            snap.width = size;
            snap.height = size * (source.height / source.width);
            const sctx = snap.getContext('2d');
            sctx.drawImage(source, 0, 0, source.width, source.height, 0, 0, snap.width, snap.height);
            return snap.toDataURL('image/png');
        }

        // 명예의 전당에 등록
        function saveToHallOfFame() {
            const alpha = parseInt(document.getElementById('alphaSlider').value);
            const name = (document.getElementById('hallName').value || '').trim().slice(0, 20) || '익명';

            const record = {
                id: Date.now(),
                name: name,
                alpha: alpha,
                beta: 100 - alpha,
                image: getBlendSnapshot(160),
                timestamp: new Date().toLocaleTimeString('ko-KR'),
                description: `${alpha}% : ${100 - alpha}% 블렌딩`
            };

            let records = JSON.parse(localStorage.getItem('blendRecords')) || [];
            records.unshift(record);
            if (records.length > 20) records.pop();
            localStorage.setItem('blendRecords', JSON.stringify(records));

            alert('✨ 명예의 전당에 등록되었습니다!');
            document.getElementById('saveHallBtn').style.display = 'none';
            document.getElementById('hallNameWrap').style.display = 'none';
        }

        // 초기화
        function resetAll() {
            img1 = null;
            img2 = null;
            document.getElementById('file1').value = '';
            document.getElementById('file2').value = '';
            document.getElementById('alphaSlider').value = 50;
            document.getElementById('alphaSlider').dispatchEvent(new Event('input'));

            if (webcamActive) stopWebcam();

            document.getElementById('img1').style.display = 'none';
            document.getElementById('img2').style.display = 'none';
            document.getElementById('placeholder1').style.display = 'block';
            document.getElementById('placeholder2').style.display = 'block';
            document.getElementById('downloadBtn').disabled = true;
            document.getElementById('saveHallBtn').style.display = 'none';
            document.getElementById('hallNameWrap').style.display = 'none';

            const ctx = document.getElementById('resultCanvas').getContext('2d');
            ctx.clearRect(0, 0, 400, 300);
        }

        // 초기 업로드 영역 설정
        function setupUploadAreas() {
            ['container1', 'container2'].forEach(containerId => {
                const container = document.getElementById(containerId);
                container.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    container.style.borderColor = '#f5576c';
                    container.style.background = '#fff5f7';
                });
                container.addEventListener('dragleave', () => {
                    container.style.borderColor = '#cbd5e1';
                    container.style.background = '#f8fafc';
                });
                container.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const files = e.dataTransfer.files;
                    if (files.length > 0 && files[0].type.startsWith('image/')) {
                        const fileId = containerId === 'container1' ? 'file1' : 'file2';
                        const dt = new DataTransfer();
                        dt.items.add(files[0]);
                        document.getElementById(fileId).files = dt.files;
                        document.getElementById(fileId).dispatchEvent(new Event('change'));
                    }
                    container.style.borderColor = '#cbd5e1';
                    container.style.background = '#f8fafc';
                });
            });
        }

        // 페이지 로드 시 초기화
        window.addEventListener('load', () => {
            setupUploadAreas();
        });
    </script>
</body>
