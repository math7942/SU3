<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학실험 · 수수의 수학</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
  .quick-links{ margin: 0 0 34px; }
  .quick-links-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .quick-links-head h2{ margin:0; font-size:1.02rem; font-weight:700; color: var(--ink-soft); }
  .quick-link-form{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .quick-link-form input{
    flex:1 1 160px; min-width:0; padding:9px 12px; border:1px solid var(--line); border-radius:9px;
    background: var(--bg); color: var(--ink); font: inherit; font-size:0.9rem;
  }
  .quick-link-form input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .quick-links-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .quick-links-empty{ margin:0; color: var(--muted); font-size:0.88rem; }
  .quick-link-chip{
    display:inline-flex; align-items:center; gap:6px; padding:7px 8px 7px 14px;
    border:1px solid var(--line); border-radius:999px; background: var(--surface);
  }
  .quick-link-chip a{ color: var(--ink); font-size:0.9rem; font-weight:600; text-decoration:none; }
  .quick-link-chip a:hover{ color: var(--accent); }
  .quick-link-del{
    display:grid; place-items:center; width:20px; height:20px; border:none; border-radius:50%;
    background: var(--accent-soft); color: var(--accent); font-size:0.85rem; line-height:1; cursor:pointer; padding:0;
  }
  .quick-link-del:hover{ opacity:0.8; }
</style>
</head>
<body class="g2">
<div class="page">

  <header class="group-head">
    <a class="back" href="../index.html">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M8 2.5 4.5 6 8 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      전체 분류
    </a>
    <span class="badge" aria-hidden="true">🧪</span>
    <h1>수학실험</h1>
    <p>학년과 과목에 따라 나눈 11개 실험실입니다.</p>
  </header>

  <main>
    <section class="quick-links" aria-label="유용한 사이트">
      <div class="quick-links-head">
        <h2>유용한 사이트</h2>
        <button type="button" class="btn secondary" id="quickLinkAddBtn">+ 추가</button>
      </div>
      <form id="quickLinkForm" class="quick-link-form" hidden>
        <input type="text" id="quickLinkName" placeholder="이름 (예: 지오지브라)" required>
        <input type="text" id="quickLinkUrl" placeholder="주소 (예: geogebra.org)" required>
        <button type="submit" class="btn">저장</button>
      </form>
      <div class="quick-links-list" id="quickLinksList"></div>
    </section>
<!-- 실험실을 추가하려면 폴더를 만들고 아래 목록에 <a class="subcard"> 한 덩어리를 붙여 넣으세요. -->
    <div class="subgroups">
      <a class="subcard vacant" href="01-common/index.html">
        <span class="icon" aria-hidden="true">🧮</span>
        <h3>공통수학</h3>
        <span class="count">준비 중</span>
      </a>
      <a class="subcard filled" href="02-algebra/index.html">
        <span class="icon" aria-hidden="true">📈</span>
        <h3>대수</h3>
        <span class="count">도구 2개</span>
      </a>
      <a class="subcard filled" href="03-statistics/index.html">
        <span class="icon" aria-hidden="true">🎲</span>
        <h3>확률과 통계</h3>
        <span class="count">도구 1개</span>
      </a>
      <a class="subcard filled" href="04-geometry/index.html">
        <span class="icon" aria-hidden="true">📐</span>
        <h3>기하</h3>
        <span class="count">도구 1개</span>
      </a>
      <a class="subcard filled" href="05-calculus/index.html">
        <span class="icon" aria-hidden="true">♾️</span>
        <h3>미적분</h3>
        <span class="count">도구 15개</span>
      </a>
      <a class="subcard filled" href="06-ai-math/index.html">
        <span class="icon" aria-hidden="true">🤖</span>
        <h3>인공지능 수학</h3>
        <span class="count">도구 25개</span>
      </a>
      <a class="subcard vacant" href="07-economics/index.html">
        <span class="icon" aria-hidden="true">💹</span>
        <h3>경제수학</h3>
        <span class="count">준비 중</span>
      </a>
      <a class="subcard vacant" href="08-middle1/index.html">
        <span class="icon" aria-hidden="true">1️⃣</span>
        <h3>중학교 1학년</h3>
        <span class="count">준비 중</span>
      </a>
      <a class="subcard vacant" href="09-middle2/index.html">
        <span class="icon" aria-hidden="true">2️⃣</span>
        <h3>중학교 2학년</h3>
        <span class="count">준비 중</span>
      </a>
      <a class="subcard filled" href="10-middle3/index.html">
        <span class="icon" aria-hidden="true">3️⃣</span>
        <h3>중학교 3학년</h3>

<script src="../assets/tool-count.js"></script>
<script>
(function(){
  var KEY = 'su3-lab-quicklinks';
  var DELETE_PASSWORD = '3.141592';
  function load(){
    try{ return JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(e){ return []; }
  }
  function save(links){
    try{ localStorage.setItem(KEY, JSON.stringify(links)); }catch(e){}
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function normalizeUrl(u){
    u = String(u || '').trim();
    if(!u) return '';
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  var listEl = document.getElementById('quickLinksList');
  var addBtn = document.getElementById('quickLinkAddBtn');
  var form = document.getElementById('quickLinkForm');
  var nameInput = document.getElementById('quickLinkName');
  var urlInput = document.getElementById('quickLinkUrl');
  if(!listEl || !addBtn || !form) return;

  var links = [];

  function render(){
    links = load();
    if(!links.length){
      listEl.innerHTML = '<p class="quick-links-empty">아직 추가한 사이트가 없어요. "+ 추가"를 눌러보세요.</p>';
      return;
    }
    listEl.innerHTML = links.map(function(l, i){
      return '<span class="quick-link-chip">' +
        '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + '</a>' +
        '<button type="button" class="quick-link-del" data-i="' + i + '" aria-label="' + esc(l.name) + ' 삭제" title="삭제">×</button>' +
      '</span>';
    }).join('');
    Array.prototype.forEach.call(listEl.querySelectorAll('.quick-link-del'), function(btn){
      btn.addEventListener('click', function(){
        var input = window.prompt('삭제하려면 비밀번호를 입력하세요.');
        if(input === null) return;
        if(input !== DELETE_PASSWORD){
          alert('비밀번호가 올바르지 않습니다.');
          return;
        }
        var i = +btn.dataset.i;
        links.splice(i, 1);
        save(links);
        render();
      });
    });
  }

  addBtn.addEventListener('click', function(){
    form.hidden = !form.hidden;
    if(!form.hidden) nameInput.focus();
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = nameInput.value.trim();
    var url = normalizeUrl(urlInput.value);
    if(!name || !url) return;
    links.push({ name: name, url: url });
    save(links);
    nameInput.value = '';
    urlInput.value = '';
    form.hidden = true;
    render();
  });

  render();
})();
</script>
</body>
</html>
