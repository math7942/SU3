<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST 손글씨 인식기 (정밀 CNN)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

        body {
            background-color: #eaf1f9;
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        .title-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .icon-box {
            background-color: #4b89dc;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            line-height: 1.1;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            color: #1e293b;
            margin: 0;
            letter-spacing: -1px;
        }

        .instruction-box {
            background-color: #eef2ff;
            border: 1px solid #d8e0ff;
            border-radius: 12px;
            padding: 20px 30px;
            max-width: 1100px;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .instruction-box h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #334155;
        }

        .instruction-box p {
            margin: 0;
            color: #64748b;
            font-size: 0.95rem;
        }

        .status-bar {
            background-color: #fef3c7;
            color: #d97706;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            max-width: 1100px;
            text-align: center;
            font-weight: 700;
            margin-bottom: 30px;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
        }

        .canvas-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 320px;
        }

        canvas {
            background-color: white;
            border: 2px solid #a5b4fc;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            cursor: crosshair;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px; 
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-clear { background-color: #fb7185; }
        .btn-recognize { background-color: #6366f1; }
        .btn-matrix { background-color: #10b981; margin-top: 20px; width: 100%; justify-content: center; font-size: 0.9rem;}

        .result-section {
            background-color: #eff6ff;
            border: 2px solid #bfdbfe;
            border-radius: 16px;
            width: 320px;
            padding: 30px 20px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeInRight 0.5s ease-out;
        }

        .big-number {
            font-size: 5rem;
            font-weight: 900;
            color: #6366f1;
            line-height: 1;
            margin: 0;
        }

        .confidence {
            color: #64748b;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .bar-chart {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #475569;
        }

        .bar-label {
            width: 15px;
            font-weight: 700;
        }

        .bar-bg {
            flex-grow: 1;
            background-color: #e2e8f0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background-color: #cbd5e1;
            width: 0%;
            transition: width 0.5s ease-out;
        }

        .bar-fill.active {
            background-color: #ef4444;
        }

        .bar-percent {
            width: 45px;
            text-align: right;
            font-size: 0.8rem;
        }

        .matrix-section {
            background-color: white;
            border-radius: 16px;
            width: 400px;
            padding: 30px 20px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            animation: fadeInRight 0.5s ease-out;
        }

        .matrix-section h3 {
            margin: 0 0 15px 0;
            color: #334155;
            font-size: 1.1rem;
        }

        #matrixOutput {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            line-height: 11px;
            letter-spacing: 4px;
            background-color: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            overflow-x: auto;
            white-space: pre;
            color: #cbd5e1;
            text-align: center;
        }

        .pixel-active {
            color: #0f172a;
            font-weight: 900;
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="title-container">
        <div class="icon-box">1 2<br>3 4</div>
        <h1>MNIST 손글씨 인식기 (정밀 CNN)</h1>
    </div>

    <div class="instruction-box">
        <h3>사용법</h3>
        <p>1. 캔버스에 0~9 사이의 숫자를 자유롭게 그려보세요.<br>2. <b>'인식하기'</b> 버튼을 누르면 정밀하게 학습된 합성곱 신경망(CNN)이 확률을 계산합니다.<br>3. <b>'행렬 보기'</b> 버튼을 눌러 정돈된 28x28 데이터를 확인해 보세요!</p>
    </div>

    <div class="status-bar" id="statusBar">
        🧠 화면 구성 완료! 인공지능 모델을 가져오는 중입니다...
    </div>

    <div class="main-container">
        <div class="canvas-section">
            <canvas id="drawCanvas" width="280" height="280"></canvas>
            <div class="button-group">
                <button class="btn-clear" id="clearBtn">🗑️ 지우기</button>
                <button class="btn-recognize" id="recognizeBtn">🔍 인식하기</button>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <div class="big-number" id="predNumber">?</div>
            <div class="confidence" id="predConfidence">신뢰도 0.0%</div>
            <div class="bar-chart" id="barChart"></div>
            <button class="btn-matrix" id="showMatrixBtn">📊 자동 정렬된 데이터 확인하기<br>(행렬 보기)</button>
        </div>

        <div class="matrix-section" id="matrixSection">
            <h3>28x28 행렬 데이터 (질량 중심 정규화)</h3>
            <div id="matrixOutput"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/3.20.0/tf.min.js"></script>
    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const recognizeBtn = document.getElementById('recognizeBtn');
        const showMatrixBtn = document.getElementById('showMatrixBtn');
        const resultSection = document.getElementById('resultSection');
        const matrixSection = document.getElementById('matrixSection');
        const barChart = document.getElementById('barChart');
        const statusBar = document.getElementById('statusBar');

        let isDrawing = false;
        let hasDrawn = false;
        let aiModel; 

        // 안정적인 10-Digit MNIST 모델 주소들 (방화벽 대비용 3개)
        const modelUrls = [
            'https://raw.githubusercontent.com/bensonruan/MNIST-Digit-Recognition/master/models/model.json',
            'https://cdn.jsdelivr.net/gh/bensonruan/MNIST-Digit-Recognition@master/models/model.json',
            'https://raw.githubusercontent.com/tsu-nera/tfjs-mnist-study/master/model/model.json'
        ];

        async function loadModel() {
            // 라이브러리 자체가 차단되었는지 확인
            if (typeof tf === 'undefined') {
                statusBar.innerText = "교육청 보안망에 의해 인공지능 라이브러리 접속이 차단되었습니다! 스마트폰 테더링(핫스팟)을 연결하거나, CodePen 사이트에서 실행해주세요.";
                statusBar.style.backgroundColor = "#fee2e2";
                statusBar.style.color = "#dc2626";
                return;
            }

            let lastError = "";
            for (let url of modelUrls) {
                try {
                    aiModel = await tf.loadLayersModel(url);
                    
                    tf.tidy(() => {
                        try { aiModel.predict(tf.zeros([1, 28, 28, 1])); } 
                        catch(e) { aiModel.predict(tf.zeros([1, 784])); }
                    });

                    statusBar.innerText = "정밀 CNN 모델 탑재 완료! ✓ (이제 완벽하게 판별합니다)";
                    statusBar.style.backgroundColor = "#d1fae5";
                    statusBar.style.color = "#059669";
                    return; 
                } catch (error) {
                    lastError = error.message;
                }
            }
            
            statusBar.innerText = `모델 파일 다운로드 차단됨! (교육청 방화벽 문제일 확률이 높습니다)`;
            statusBar.style.backgroundColor = "#fee2e2";
            statusBar.style.color = "#dc2626";
        }
        
        // 캔버스 초기화는 모델 로딩과 상관없이 바로 실행
        function initCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 18; 
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'black';
            hasDrawn = false;
            
            resultSection.style.display = 'none';
            matrixSection.style.display = 'none';
        }

        initCanvas();
        loadModel(); // UI 준비 후 비동기로 모델 로딩 시작

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            hasDrawn = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.stroke();
            }
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);
        clearBtn.addEventListener('click', initCanvas);

        function getPreprocessedCanvas() {
            const rawData = ctx.getImageData(0, 0, 280, 280).data;
            let minX = 280, minY = 280, maxX = 0, maxY = 0;
            let hasPixel = false;

            for (let y = 0; y < 280; y++) {
                for (let x = 0; x < 280; x++) {
                    if (rawData[(y * 280 + x) * 4] < 200) { 
                        hasPixel = true;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            if (!hasPixel) return null;

            const w = maxX - minX + 1;
            const h = maxY - minY + 1;

            const scale = 20.0 / Math.max(w, h);
            const scaledW = Math.round(w * scale);
            const scaledH = Math.round(h * scale);

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = scaledW;
            tempCanvas.height = scaledH;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.fillStyle = 'white';
            tCtx.fillRect(0, 0, scaledW, scaledH);
            tCtx.imageSmoothingEnabled = true;
            tCtx.imageSmoothingQuality = 'high';
            tCtx.drawImage(canvas, minX, minY, w, h, 0, 0, scaledW, scaledH);

            const imgData = tCtx.getImageData(0, 0, scaledW, scaledH).data;
            let sumX = 0, sumY = 0, totalWeight = 0;
            for (let y = 0; y < scaledH; y++) {
                for (let x = 0; x < scaledW; x++) {
                    let weight = 255 - imgData[(y * scaledW + x) * 4];
                    if (weight > 0) {
                        sumX += x * weight;
                        sumY += y * weight;
                        totalWeight += weight;
                    }
                }
            }

            let cx = totalWeight > 0 ? sumX / totalWeight : scaledW / 2;
            let cy = totalWeight > 0 ? sumY / totalWeight : scaledH / 2;

            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 28;
            finalCanvas.height = 28;
            const finalCtx = finalCanvas.getContext('2d');
            finalCtx.fillStyle = 'white';
            finalCtx.fillRect(0, 0, 28, 28);

            let dx = Math.round(14 - cx);
            let dy = Math.round(14 - cy);

            finalCtx.drawImage(tempCanvas, 0, 0, scaledW, scaledH, dx, dy, scaledW, scaledH);

            return finalCanvas;
        }

        recognizeBtn.addEventListener('click', () => {
            if (!aiModel) {
                alert("상단의 상태바를 확인해주세요! AI 모델이 로딩되지 않았습니다."); return;
            }
            if (!hasDrawn) {
                alert("먼저 캔버스에 숫자를 그려주세요!"); return;
            }

            const processedCanvas = getPreprocessedCanvas();
            if (!processedCanvas) return;

            const probabilities = tf.tidy(() => {
                let img = tf.browser.fromPixels(processedCanvas, 1).toFloat();
                img = tf.scalar(255.0).sub(img).div(tf.scalar(255.0));
                
                let pred;
                try { pred = aiModel.predict(img.expandDims(0)); } 
                catch(e) { pred = aiModel.predict(img.reshape([1, 784])); }
                return pred.dataSync(); 
            });

            let targetDigit = 0, maxProb = 0;
            for (let i = 0; i < 10; i++) {
                let probVal = probabilities[i];
                if (isNaN(probVal) || probVal === undefined) probVal = 0;
                
                if (probVal > maxProb) { 
                    maxProb = probVal; 
                    targetDigit = i; 
                }
            }
            const targetProb = (maxProb * 100).toFixed(1); 

            document.getElementById('predNumber').innerText = targetDigit;
            document.getElementById('predConfidence').innerText = `신뢰도 ${targetProb}%`;

            let barsHTML = '';
            for (let i = 0; i < 10; i++) {
                let probVal = probabilities[i];
                if (isNaN(probVal) || probVal === undefined) probVal = 0;
                
                const prob = (probVal * 100).toFixed(1);
                const isActive = i === targetDigit ? 'active' : '';
                barsHTML += `
                    <div class="bar-row">
                        <div class="bar-label">${i}</div>
                        <div class="bar-bg"><div class="bar-fill ${isActive}" style="width: ${prob}%"></div></div>
                        <div class="bar-percent">${prob}%</div>
                    </div>`;
            }
            barChart.innerHTML = barsHTML;
            resultSection.style.display = 'flex';
            matrixSection.style.display = 'none'; 
        });

        showMatrixBtn.addEventListener('click', () => {
            const processedCanvas = getPreprocessedCanvas();
            if (!processedCanvas) return;

            const imgData = processedCanvas.getContext('2d').getImageData(0, 0, 28, 28).data;
            let matrixHTML = '';
            for (let y = 0; y < 28; y++) {
                for (let x = 0; x < 28; x++) {
                    const brightness = 255 - imgData[(y * 28 + x) * 4]; 
                    let val = Math.round((brightness / 255) * 9);
                    if(val > 0) matrixHTML += `<span class="pixel-active">${val}</span>`;
                    else matrixHTML += `0`;
                }
                matrixHTML += '<br>';
            }
            document.getElementById('matrixOutput').innerHTML = matrixHTML;
            matrixSection.style.display = 'flex';
        });
    </script>
</body>
</html>
