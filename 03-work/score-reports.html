<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생별 정오표 전체 출력 만들기</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        h2 { color: #333; margin-top: 0; margin-bottom: 15px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .file-label { display: block; margin: 0 auto 20px auto; padding: 30px 15px; border: 2px dashed #007bff; border-radius: 10px; background-color: #f0f8ff; color: #007bff; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 16px; }
        .file-label:hover { background-color: #e1f0ff; }
        input[type="file"] { display: none; }
        button { background-color: #4CAF50; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; width: 90%; }
        button:hover { background-color: #45a049; }
        button.secondary { background-color: #007bff; margin-top: 10px; }
        button.secondary:hover { background-color: #0069d9; }
        #status { margin-top: 20px; font-weight: bold; color: #333; font-size: 15px; word-break: keep-all; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📄 Made by 수수!</h2>
        <p><b>지필평가-지필평가조회-교과목별학생답정오표 엑셀(XLS) 다운</b></p>
        
        <label for="upload" id="file-label" class="file-label">
            📁 여기를 눌러 다운 받은 나이스 엑셀 파일을 선택하세요
        </label>
        <input type="file" id="upload" accept=".xlsx, .xls" onchange="updateFileName()" />
        
        <button onclick="processExcel()">✨ 파일 선택 후 여기를 눌러 변환 시작!</button>
        <button class="secondary" onclick="downloadHTML()">🌐 HTML로 다운로드 (인쇄 시 안 잘림)</button>

        <div id="status"></div>
    </div>

    <script>
        function updateFileName() {
            const fileInput = document.getElementById('upload');
            const label = document.getElementById('file-label');
            if (fileInput.files.length > 0) {
                label.innerHTML = `✅ 선택됨: <br><span style='color:#333; font-weight:normal;'>${fileInput.files[0].name}</span>`;
                label.style.backgroundColor = "#e6ffe6";
                label.style.borderColor = "#28a745";
                label.style.color = "#28a745";
                document.getElementById('status').innerHTML = ""; 
            }
        }

        function processExcel() {
            loadAndProcess(createIndividualSheets);
        }

        function downloadHTML() {
            loadAndProcess(createHTMLReport);
        }

        function loadAndProcess(outputFn) {
            const fileInput = document.getElementById('upload');
            const statusDiv = document.getElementById('status');

            if (!fileInput.files.length) {
                alert('파란색 박스를 눌러 엑셀 파일을 먼저 선택해주세요!');
                return;
            }

            const file = fileInput.files[0];
            statusDiv.innerHTML = "⏳ 파일을 분석 중입니다...";

            const reader = new FileReader();
            reader.onload = function(eText) {
                try {
                    const textData = eText.target.result;

                    if (textData.includes('<html') || textData.includes('<table')) {
                        console.log("HTML 기반 엑셀 파일 감지");
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(textData, 'text/html');
                        const tables = doc.querySelectorAll('table');

                        if (!tables || tables.length === 0) throw new Error("파일 내부에서 표 데이터를 찾을 수 없습니다.");

                        let targetTable = tables[0];
                        for(let t of tables) { if(t.rows.length > targetTable.rows.length) targetTable = t; }

                        const json = [];
                        for (let i = 0; i < targetTable.rows.length; i++) {
                            const rowData = [];
                            for (let j = 0; j < targetTable.rows[i].cells.length; j++) {
                                rowData.push(targetTable.rows[i].cells[j].textContent.trim());
                            }
                            json.push(rowData);
                        }
                        outputFn(json, statusDiv);

                    } else {
                        console.log("일반 엑셀 파일 감지");
                        const arrayReader = new FileReader();
                        arrayReader.onload = function(eArr) {
                            try {
                                const data = new Uint8Array(eArr.target.result);
                                const workbook = XLSX.read(data, {type: 'array'});
                                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                                const json = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
                                outputFn(json, statusDiv);
                            } catch (err2) {
                                throw new Error("일반 엑셀 변환 중 오류: " + err2.message);
                            }
                        };
                        arrayReader.readAsArrayBuffer(file);
                    }
                } catch (err) {
                    alert("🚨 파일 분석 중 오류가 발생했습니다: \n" + err.message);
                    statusDiv.innerHTML = `<span style='color: red;'>❌ 변환 실패: ${err.message}</span>`;
                }
            };

            reader.readAsText(file, 'euc-kr');
        }

        function esc(v) {
            return String(v === undefined || v === null ? "" : v).replace(/[&<>"']/g, function(c) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
            });
        }

        function parseStructure(json) {
            if (!json || json.length === 0) throw new Error("엑셀 파일에 데이터가 없습니다.");

            let fileNameInfo = "개별성적표";
            for (let i = 0; i < Math.min(10, json.length); i++) {
                if (json[i]) {
                    let rowStr = json[i].filter(c => String(c).trim() !== "").join(" ");
                    if (rowStr.includes("학년도") && rowStr.includes("학기")) {
                        fileNameInfo = rowStr.replace(/1차\s*정기시험/g, " ").replace(/:/g, "_").trim().replace(/\s+/g, "_");
                        break;
                    }
                }
            }

            let headerStartIdx = -1;
            for (let i = 0; i < json.length; i++) {
                if (json[i]) {
                    for(let j = 0; j < json[i].length; j++) {
                        if (json[i][j] && (String(json[i][j]).includes("번호") || String(json[i][j]).includes("반/번호"))) {
                            headerStartIdx = i; break;
                        }
                    }
                    if (headerStartIdx !== -1) break;
                }
            }

            if (headerStartIdx === -1) {
                throw new Error("표에서 '반/번호' 항목을 찾지 못했습니다. 올바른 나이스 다운로드 파일인지 확인해주세요.");
            }

            const rawH1 = json[headerStartIdx];
            const rawH2 = json[headerStartIdx + 1] || [];
            const rawH3 = json[headerStartIdx + 2] || [];
            const validCols = [];
            const newScoreCols = [];

            for(let c = 3; c < Math.max(rawH1.length, rawH2.length, rawH3.length); c++) {
                if (String(rawH1[c] || "").trim() !== "" || String(rawH2[c] || "").trim() !== "") {
                    const headerText = String(rawH1[c]).replace(/\s/g, '');

                    if (headerText === "기타점수") continue;

                    validCols.push(c);
                    if (["선택형점수", "서답형점수", "과목총점"].includes(headerText)) {
                        newScoreCols.push(validCols.length + 2);
                    }
                }
            }

            return { fileNameInfo, headerStartIdx, rawH1, rawH2, rawH3, validCols, newScoreCols };
        }

        function createHTMLReport(json, statusDiv) {
            try {
                const { fileNameInfo, headerStartIdx, rawH1, rawH2, rawH3, validCols, newScoreCols } = parseStructure(json);

                let dynamicFontSize = 9.0;
                if (validCols.length > 20) dynamicFontSize = 8.0;
                if (validCols.length > 25) dynamicFontSize = 7.0;
                if (validCols.length > 30) dynamicFontSize = 6.5;

                const qCount = validCols.length - newScoreCols.length;
                const scoreColPct = 7;
                const fixedPct = 12; // 반/번호 6% + 성명 6%
                const qPctTotal = 100 - fixedPct - (newScoreCols.length * scoreColPct);
                const qPct = Math.max(1.5, qPctTotal / Math.max(1, qCount));

                function headerLabel(origIdx, idx) {
                    const isScoreCol = newScoreCols.includes(idx + 3);
                    let val = rawH1[origIdx];
                    if (isScoreCol && val) {
                        const cleanVal = String(val).replace(/\s/g, '');
                        if (cleanVal === '선택형점수') return '선택형<br>점수';
                        if (cleanVal === '서답형점수') return '서답형<br>점수';
                        if (cleanVal === '과목총점') return '과목<br>총점';
                    }
                    return esc(val);
                }

                let colgroup = '<colgroup><col style="width:6%"><col style="width:6%">';
                validCols.forEach((origIdx, idx) => {
                    const isScoreCol = newScoreCols.includes(idx + 3);
                    colgroup += '<col style="width:' + (isScoreCol ? scoreColPct : qPct) + '%">';
                });
                colgroup += '</colgroup>';

                let blocks = "";
                let studentCount = 0;

                for (let i = headerStartIdx + 3; i < json.length; i++) {
                    const rawStudent = json[i];
                    if (!rawStudent || !rawStudent[2] || String(rawStudent[2]).trim() === "") continue;
                    studentCount++;

                    let row1 = '<tr><th rowspan="3">반/번호</th><th rowspan="3">성명</th>';
                    let row2 = '<tr>';
                    let row3 = '<tr>';
                    let rowData = '<tr><td class="data">' + esc(rawStudent[1] || "") + '</td><td class="data">' + esc(rawStudent[2] || "") + '</td>';

                    validCols.forEach((origIdx, idx) => {
                        const isScoreCol = newScoreCols.includes(idx + 3);
                        if (isScoreCol) {
                            row1 += '<th rowspan="3">' + headerLabel(origIdx, idx) + '</th>';
                        } else {
                            row1 += '<th>' + esc(rawH1[origIdx]) + '</th>';
                            row2 += '<td class="sub">' + esc(rawH2[origIdx]) + '</td>';
                            row3 += '<td class="sub">' + esc(rawH3[origIdx]) + '</td>';
                        }
                        let val = rawStudent[origIdx];
                        if (isScoreCol && (val === undefined || val === null || String(val).trim() === "")) val = 0;
                        rowData += '<td class="data' + (isScoreCol ? ' score' : '') + '">' + esc(val !== undefined ? val : "") + '</td>';
                    });

                    row1 += '</tr>';
                    row2 += '</tr>';
                    row3 += '</tr>';
                    rowData += '</tr>';

                    blocks += '<div class="student-block"><table style="font-size:' + dynamicFontSize + 'pt">' + colgroup + '<tbody>' + row1 + row2 + row3 + rowData + '</tbody></table></div>';
                }

                if (studentCount === 0) throw new Error("학생 데이터를 찾지 못했습니다.");

                const title = esc(fileNameInfo.replace(/_/g, ' '));
                const html = '<!DOCTYPE html>\n<html lang="ko">\n<head>\n<meta charset="UTF-8">\n<title>' + title + ' 개별정오표</title>\n<style>\n' +
                    "  body { font-family: '맑은 고딕', sans-serif; margin: 0; padding: 10mm; color: #222; }\n" +
                    "  h1 { font-size: 13pt; text-align: center; margin: 0 0 10mm; }\n" +
                    "  .student-block { break-inside: avoid; page-break-inside: avoid; margin-bottom: 6mm; }\n" +
                    "  table { width: 100%; border-collapse: collapse; table-layout: fixed; }\n" +
                    "  th, td { border: 1px solid #999; text-align: center; vertical-align: middle; padding: 2px 1px; word-break: keep-all; }\n" +
                    "  th { background: #f2f2f2; font-weight: bold; }\n" +
                    "  td.sub { background: #fafafa; }\n" +
                    "  td.data { font-weight: bold; }\n" +
                    "  @page { size: A4 portrait; margin: 10mm; }\n" +
                    "  @media print { body { padding: 0; } }\n" +
                    '</style>\n</head>\n<body>\n<h1>' + title + ' 개별정오표</h1>\n' + blocks + '\n</body>\n</html>';

                const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileNameInfo + '_개별정오표.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                statusDiv.innerHTML = `<span style='color: green;'>✅ 성공! <br><b>${fileNameInfo}_개별정오표.html</b> 파일이 저장되었습니다.<br>(브라우저로 열어서 인쇄하면 학생이 페이지 중간에서 잘리지 않습니다)</span>`;
            } catch (error) {
                console.error(error);
                alert("🚨 조립 과정 중 오류가 발생했습니다: \n" + error.message);
                statusDiv.innerHTML = `<span style='color: red;'>❌ 조립 실패: ${error.message}</span>`;
            }
        }

        function createIndividualSheets(json, statusDiv) {
            try {
                const { fileNameInfo, headerStartIdx, rawH1, rawH2, rawH3, validCols, newScoreCols } = parseStructure(json);

                // 💡 [수정] 어떤 환경에서도 잘리지 않도록 폰트 크기를 조금 더 줄여서 공간을 강제로 확보
                let dynamicFontSize = 9.0;
                if (validCols.length > 20) dynamicFontSize = 8.0;
                if (validCols.length > 25) dynamicFontSize = 7.0;
                if (validCols.length > 30) dynamicFontSize = 6.5;

                // 💡 [수정] 학생 한 명(헤더 3줄 + 점수 1줄 + 여백 1줄)이 절대 페이지 중간에서
                // 잘리지 않도록, 실제 행 높이를 직접 지정하고 그 높이를 기준으로
                // 한 페이지에 몇 명이 들어갈지 미리 계산한다 (엑셀의 자동 줄바꿈 높이 추정에 맡기지 않음)
                // 2줄로 꺾이는 "선택형\n점수" 같은 라벨은 맨 위 헤더행(rawH1)에만 나오므로
                // 그 행만 2줄 높이로 잡고, 정답·배점 행은 일반 데이터 행과 같은 1줄 높이로 둔다
                // (전부 2줄 높이로 잡으면 불필요하게 칸이 커져서 페이지 수가 늘어난다)
                const lineFactor = 1.35;
                const cellPadding = 2; // 너무 크게 잡으면 페이지가 불필요하게 늘어나므로 최소한으로만 확보
                const headerRowHeight = Math.ceil(2 * dynamicFontSize * lineFactor + cellPadding); // 점수열 헤더는 2줄(예: "선택형\n점수")까지 들어갈 수 있음
                const dataRowHeight = Math.ceil(dynamicFontSize * lineFactor + cellPadding);
                const blankRowHeight = 4;
                const studentBlockHeight = headerRowHeight + (dataRowHeight * 3) + blankRowHeight;
                const usableHeightPt = (11.69 - 0.8) * 72; // A4 세로 - 위아래 여백(0.4in씩, 아래 !margins와 동일)
                const studentsPerPage = Math.max(1, Math.floor(usableHeightPt / studentBlockHeight) - 1); // -1은 여유분

                const outputData = [];
                const rowHeights = [];
                const merges = [];
                const rowBreaks = [];
                let currentRow = 0;

                function createCell(val, isHeader) {
                    return {
                        v: val,
                        s: {
                            border: { top: {style:"thin"}, bottom: {style:"thin"}, left: {style:"thin"}, right: {style:"thin"} },
                            alignment: { horizontal: "center", vertical: "center", wrapText: true },
                            font: { bold: false, name: "맑은 고딕", sz: dynamicFontSize },
                            fill: isHeader ? { fgColor: { rgb: "F2F2F2" } } : undefined
                        }
                    };
                }

                function buildRow(rawArr, isHeader, isStudentData = false) {
                    let row = [];
                    if(isHeader) {
                        row.push(createCell("반/번호", true));
                        row.push(createCell("", true));
                        row.push(createCell("성명", true));
                    } else {
                        row.push(createCell(rawArr[1] || "", false));
                        row.push(createCell("", false));
                        row.push(createCell(rawArr[2] || "", false));
                    }

                    validCols.forEach((origIdx, i) => {
                        let val = rawArr[origIdx];
                        const isScoreCol = newScoreCols.includes(i + 3);

                        if (isHeader && isScoreCol && val) {
                            const cleanVal = String(val).replace(/\s/g, '');
                            if (cleanVal === '선택형점수') val = '선택형\n점수';
                            if (cleanVal === '서답형점수') val = '서답형\n점수';
                            if (cleanVal === '과목총점') val = '과목\n총점';
                        }

                        if (isStudentData && isScoreCol) {
                            if (val === undefined || val === null || String(val).trim() === "") {
                                val = 0;
                            }
                        }
                        row.push(createCell(val !== undefined ? val : "", isHeader));
                    });
                    return row;
                }

                let studentCount = 0;
                for (let i = headerStartIdx + 3; i < json.length; i++) {
                    const rawStudent = json[i];
                    if (!rawStudent || !rawStudent[2] || String(rawStudent[2]).trim() === "") continue;

                    outputData.push(buildRow(rawH1, true));
                    outputData.push(buildRow(rawH2, true));
                    outputData.push(buildRow(rawH3, true));
                    outputData.push(buildRow(rawStudent, false, true));
                    rowHeights.push({hpt: headerRowHeight}, {hpt: dataRowHeight}, {hpt: dataRowHeight}, {hpt: dataRowHeight});

                    merges.push({s: {r: currentRow, c: 0}, e: {r: currentRow+2, c: 1}});
                    merges.push({s: {r: currentRow, c: 2}, e: {r: currentRow+2, c: 2}});
                    merges.push({s: {r: currentRow+3, c: 0}, e: {r: currentRow+3, c: 1}});

                    newScoreCols.forEach(colIdx => {
                        merges.push({s: {r: currentRow, c: colIdx}, e: {r: currentRow+2, c: colIdx}});
                    });

                    currentRow += 4;
                    outputData.push([]);
                    rowHeights.push({hpt: blankRowHeight});
                    currentRow += 1;

                    studentCount++;

                    // 학생 블록 높이를 기준으로 계산한 안전한 인원마다 페이지 자르기
                    if (studentCount % studentsPerPage === 0) {
                        rowBreaks.push(currentRow - 1);
                    }
                }

                const newWorksheet = XLSX.utils.aoa_to_sheet(outputData);
                newWorksheet['!rows'] = rowHeights;
                newWorksheet['!merges'] = merges;
                newWorksheet['!rowBreaks'] = rowBreaks;

                // 💡 [수정] 한셀이나 구버전 엑셀에서 프로그램이 크기 조절을 무시해도 아예 물리적 너비가 A4에 맞도록 (기존 82 -> 72로 대폭 축소)
                const targetTotalWch = 72; 
                const fixedWch = 1.2 + 1.2 + 5.0; // 이름 및 번호열 폭 축소
                const scoreWchTotal = newScoreCols.length * 4.0; // 점수열 폭 축소
                const remainingWch = targetTotalWch - fixedWch - scoreWchTotal;
                const qCount = validCols.length - newScoreCols.length;
                const qWch = Math.max(1.2, remainingWch / qCount); 

                let colWidths = [{wch: 1.2}, {wch: 1.2}, {wch: 5.0}]; 
                validCols.forEach((_, i) => {
                    const isScore = newScoreCols.includes(i + 3);
                    colWidths.push({ wch: isScore ? 4.0 : qWch }); 
                });
                newWorksheet['!cols'] = colWidths;
                
                // 💡 [수정] 좌우 여백을 최소치인 0.2로 세팅하여 공간 최대로 활용
                newWorksheet['!margins'] = { left: 0.2, right: 0.2, top: 0.4, bottom: 0.4, header: 0, footer: 0 };
                
                // 💡 [수정] 높이 맞춤(fitToHeight)을 0이 아닌 999로 설정하여 엑셀 오류 방지 및 A4 사이즈 지정(paperSize: 9)
                newWorksheet['!sheetPr'] = { pageSetUpPr: { fitToPage: true, autoPageBreaks: true } };
                newWorksheet['!pageSetup'] = { 
                    paperSize: 9, 
                    orientation: 'portrait', 
                    fitToPage: true, 
                    fitToWidth: 1, 
                    fitToHeight: 999 
                }; 

                const newWorkbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "성적표");
                
                const finalFileName = `${fileNameInfo}_개별정오표_최종.xlsx`;
                XLSX.writeFile(newWorkbook, finalFileName);
                
                statusDiv.innerHTML = `<span style='color: green;'>✅ 성공! <br><b>${finalFileName}</b> 파일이 저장되었습니다.</span>`;
            } catch (error) {
                console.error(error);
                alert("🚨 조립 과정 중 오류가 발생했습니다: \n" + error.message);
                statusDiv.innerHTML = `<span style='color: red;'>❌ 조립 실패: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
