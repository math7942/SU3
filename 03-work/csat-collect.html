<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수능 가채점 수합</title>
<style>
  :root { --ink:#1d2433; --muted:#667085; --line:#d0d5dd; --bg:#f7f8fa; --card:#ffffff; --accent:#2f6fed; --bad:#c02d2d; --ok:#1f7a3d; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink:#e6e9f0; --muted:#9aa3b2; --line:#3a4150; --bg:#15181f; --card:#1d222c; --accent:#7ea6ff; --bad:#ff8a8a; --ok:#6fd38f; }
  }
  :root[data-theme="dark"] { --ink:#e6e9f0; --muted:#9aa3b2; --line:#3a4150; --bg:#15181f; --card:#1d222c; --accent:#7ea6ff; --bad:#ff8a8a; --ok:#6fd38f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  /* 선생님 화면: 가로로 넓게 써서 14개 열이 한눈에 들어오게 한다 */
  main.wide { max-width: none; padding: 16px 24px; }
  main.wide table { font-size: 0.85rem; }
  main.wide th, main.wide td { padding: 6px 6px; }
  main.wide th { white-space: normal; line-height: 1.3; }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 0.95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
  /* 과목 한 줄: 같은 과목의 칸(과목, 공통, 선택 등)을 가로로 나란히 둔다 */
  .subj-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; margin-bottom: 12px; align-items: start; }
  label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 3px; }
  /* 글자 크기 16px 이상이어야 휴대폰에서 입력할 때 화면이 확대되지 않는다 */
  input, select { width: 100%; font: inherit; font-size: 16px; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); -webkit-appearance: none; appearance: none; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  input.bad, select.bad { border-color: var(--bad); }
  .err { color: var(--bad); font-size: 0.88rem; min-height: 1.2em; margin-top: 4px; }
  .hint { color: var(--muted); font-size: 0.88rem; margin: 4px 0 0; }
  .took-row { display: flex; gap: 24px; flex-wrap: wrap; }
  .took-row label { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; color: var(--ink); cursor: pointer; }
  /* 반별 제출 현황: 번호 칸 색으로 제출·미응시·미제출을 구분한다 */
  .class-row { margin-bottom: 12px; }
  .class-label { font-weight: 600; margin-bottom: 4px; }
  .cells { display: flex; flex-wrap: wrap; gap: 4px; }
  .cell { width: 34px; height: 30px; line-height: 30px; text-align: center; border-radius: 4px; font-size: 0.85rem; border: 1px solid var(--line); color: var(--muted); }
  .cell.done { background: #d1f0dc; color: #1f5f33; border-color: #8fd1a6; }
  .cell.absent { background: #dbe7ff; color: #1d3f8a; border-color: #9fb9ef; }
  @media (max-width: 480px) { .cell { width: 28px; } }
  .took-row input[type="radio"] { -webkit-appearance: radio; appearance: auto; width: 20px; height: 20px; min-height: 0; margin: 0; accent-color: var(--accent); }
  button { font: inherit; font-size: 16px; min-height: 44px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .done { text-align: center; padding: 28px 12px; }
  .done strong { color: var(--ok); font-size: 1.15rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .status { color: var(--muted); font-size: 0.9rem; }
  /* 휴대폰 화면: 입력칸을 한 줄에 하나씩 쌓고, 버튼을 화면 너비에 맞춘다 */
  @media (max-width: 480px) {
    main { padding: 12px; }
    .card { padding: 14px; }
    .grid, .subj-row { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .row-actions { flex-direction: column; align-items: stretch; }
    .row-actions > div, .row-actions button { width: 100%; }
    button { width: 100%; }
    table { font-size: 0.82rem; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
// ---------------- 설정 ----------------
// 같은 Firebase 프로젝트(su3su3-e2669)를 쓴다. apiKey는 공개되어도 되는 식별자이고,
// 접근 제어는 Firestore 보안 규칙으로 한다 (csatScores 컬렉션 쓰기/읽기 허용 여부를 콘솔에서 확인).
const firebaseConfig = {
  apiKey: "AIzaSyD-vjDcKI1XRtWOYznrvzCKT8nOYs5690I",
  authDomain: "su3su3-e2669.firebaseapp.com",
  projectId: "su3su3-e2669",
  storageBucket: "su3su3-e2669.firebasestorage.app",
  messagingSenderId: "989821997199",
  appId: "1:989821997199:web:da319f053c098ea30560fa"
};
const SDK = "https://www.gstatic.com/firebasejs/10.12.2";
const COLLECTION = 'csatScores';

// 선택과목 목록 (교육청 양식 드롭다운과 같은 순서)
const KOR_SUBJECTS = ['화법과작문', '언어와매체'];
const MATH_SUBJECTS = ['확률과통계', '미적분', '기하'];
const INQUIRY_SUBJECTS = ['생활과윤리', '윤리와사상', '한국지리', '세계지리', '동아시아사', '세계사', '경제', '정치와법', '사회문화',
  '물리학1', '화학1', '생명과학1', '지구과학1', '물리학2', '화학2', '생명과학2', '지구과학2'];
const FOREIGN_SUBJECTS = ['독일어', '프랑스어', '스페인어', '중국어', '일본어', '러시아어', '아랍어', '베트남어', '한문'];

// 반 목록 (1반부터 8반)
const CLASSES = ['1', '2', '3', '4', '5', '6', '7', '8'];

// 점수 범위 (원점수)
// 국어·수학은 공통 원점수와 선택 원점수를 각각 받는다. 총점은 둘을 더한 값이다.
// 과목별 만점: 국어 공통 76 + 선택 24, 수학 공통 74 + 선택 26 (두 과목 모두 총점 100)
const RANGE = { hist: [0, 50], korCommon: [0, 76], korElective: [0, 24], mathCommon: [0, 74], mathElective: [0, 26], eng: [0, 100], inq: [0, 50], fl: [0, 50] };

// 대교협 양식의 과목 이름 (교육청 양식과 다른 표기만 적는다)
const KEDI_NAMES = { '언어와매체': '언어와 매체', '생활과윤리': '생활과 윤리', '사회문화': '사회·문화', '한문': '한문 I' };
const kediName = (name) => KEDI_NAMES[name] || name;

const app = document.getElementById('app');
const isTeacher = new URLSearchParams(location.search).get('mode') === 'teacher';

// ---------------- Firebase ----------------
let fbPromise = null;
function loadFirebase() {
  if (!fbPromise) {
    fbPromise = (async () => {
      const [{ initializeApp }, fs] = await Promise.all([
        import(`${SDK}/firebase-app.js`),
        import(`${SDK}/firebase-firestore.js`)
      ]);
      const app = initializeApp(firebaseConfig);
      return { fs, db: fs.getFirestore(app), app };
    })();
  }
  return fbPromise;
}

// ---------------- 공용 도구 ----------------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const opts = (list, selected = '') =>
  '<option value="">선택</option>' + list.map((v) => `<option value="${esc(v)}"${v === selected ? ' selected' : ''}>${esc(v)}</option>`).join('');
function toInt(v) {
  const s = String(v).trim();
  if (!/^\d+$/.test(s)) return null;
  return parseInt(s, 10);
}
function inRange(v, [lo, hi]) { return v !== null && v >= lo && v <= hi; }

// ---------------- 학생 화면 ----------------
function renderStudent() {
  app.innerHTML = `
    <h1>수능 가채점 결과 입력</h1>
    <p class="sub">가채점 결과를 입력하고 <strong>제출</strong>을 누르세요. 이미 제출했더라도 다시 제출하면 내용이 새로 저장됩니다.</p>
    <form id="form" novalidate>
      <section class="card">
        <h2>내 정보</h2>
        <div class="grid">
          <div><label for="grade">학년</label><select id="grade" name="grade"><option value="3" selected>3</option></select></div>
          <div><label for="cls">반</label><select id="cls" name="cls">${opts(CLASSES)}</select><div class="err" data-err="cls"></div></div>
          <div><label for="num">번호</label><input id="num" name="num" inputmode="numeric" placeholder="예: 1"></div>
          <div><label for="name">이름</label><input id="name" name="name" placeholder="홍길동"></div>
        </div>
        <div class="err" data-err="info"></div>
      </section>

      <section class="card">
        <h2>수능 응시 여부</h2>
        <div class="took-row">
          <label><input type="radio" name="took" value="yes"> 응시</label>
          <label><input type="radio" name="took" value="no"> 미응시</label>
        </div>
        <div class="err" data-err="took"></div>
      </section>

      <div id="scores" hidden>
      <section class="card">
        <h2>국어 · 수학 · 영어 · 한국사</h2>
        <div class="subj-row">
          <div><label for="kor_sub">국어 선택과목</label><select id="kor_sub" name="kor_sub">${opts(KOR_SUBJECTS)}</select><div class="err" data-err="kor_sub"></div></div>
          <div><label for="kor_common">국어 공통 원점수 (0~76)</label><input id="kor_common" name="kor_common" inputmode="numeric"><div class="err" data-err="kor_common"></div></div>
          <div><label for="kor_elective">국어 선택 원점수 (0~24)</label><input id="kor_elective" name="kor_elective" inputmode="numeric"><div class="err" data-err="kor_elective"></div></div>
        </div>
        <div class="subj-row">
          <div><label for="math_sub">수학 선택과목</label><select id="math_sub" name="math_sub">${opts(MATH_SUBJECTS)}</select><div class="err" data-err="math_sub"></div></div>
          <div><label for="math_common">수학 공통 원점수 (0~74)</label><input id="math_common" name="math_common" inputmode="numeric"><div class="err" data-err="math_common"></div></div>
          <div><label for="math_elective">수학 선택 원점수 (0~26)</label><input id="math_elective" name="math_elective" inputmode="numeric"><div class="err" data-err="math_elective"></div></div>
        </div>
        <div class="subj-row">
          <div><label for="eng">영어 원점수 (0~100)</label><input id="eng" name="eng" inputmode="numeric"><div class="err" data-err="eng"></div></div>
        </div>
        <div class="subj-row">
          <div><label for="hist">한국사 원점수 (0~50)</label><input id="hist" name="hist" inputmode="numeric"><div class="err" data-err="hist"></div></div>
        </div>
      </section>

      <section class="card">
        <h2>탐구 영역 <span class="hint">(응시한 과목만 입력하세요. 한 과목만 봤으면 한 과목만 적으면 됩니다)</span></h2>
        <div class="subj-row">
          <div><label for="inq1_sub">탐구1 과목</label><select id="inq1_sub" name="inq1_sub">${opts(INQUIRY_SUBJECTS)}</select><div class="err" data-err="inq1_sub"></div></div>
          <div><label for="inq1">탐구1 원점수 (0~50)</label><input id="inq1" name="inq1" inputmode="numeric"><div class="err" data-err="inq1"></div></div>
        </div>
        <div class="subj-row">
          <div><label for="inq2_sub">탐구2 과목</label><select id="inq2_sub" name="inq2_sub">${opts(INQUIRY_SUBJECTS)}</select><div class="err" data-err="inq2_sub"></div></div>
          <div><label for="inq2">탐구2 원점수 (0~50)</label><input id="inq2" name="inq2" inputmode="numeric"><div class="err" data-err="inq2"></div></div>
        </div>
        <div class="err" data-err="inq"></div>
      </section>

      <section class="card">
        <h2>제2외국어 · 한문 <span class="hint">(응시한 경우만)</span></h2>
        <div class="subj-row">
          <div><label for="fl_sub">제2외국어 과목</label><select id="fl_sub" name="fl_sub">${opts(FOREIGN_SUBJECTS)}</select><div class="err" data-err="fl_sub"></div></div>
          <div><label for="fl">원점수 (0~50)</label><input id="fl" name="fl" inputmode="numeric"><div class="err" data-err="fl"></div></div>
        </div>
      </section>

      </div>

      <div class="row-actions">
        <span class="status" id="status"></span>
        <button type="submit" id="submit">제출하기</button>
      </div>
    </form>`;

  const form = document.getElementById('form');
  form.addEventListener('submit', (e) => { e.preventDefault(); submitStudent(); });
  // 미응시를 고르면 과목 입력칸을 숨기고, 응시를 고르면 보여 준다
  document.querySelectorAll('input[name="took"]').forEach((r) => r.addEventListener('change', () => {
    document.getElementById('scores').hidden = r.value !== 'yes';
  }));
}

function readStudent() {
  const f = (id) => document.getElementById(id).value.trim();
  const checked = document.querySelector('input[name="took"]:checked');
  const took = checked ? checked.value : '';
  // 응시를 고르지 않았거나 미응시이면 과목 칸은 모두 비운 것으로 본다 (숨겨진 칸에 적은 값이 남지 않게)
  const s = (id) => (took === 'yes' ? f(id) : '');
  return {
    took,
    grade: f('grade'), cls: f('cls'), num: f('num'), name: f('name'),
    hist: s('hist'), kor_sub: s('kor_sub'), kor_common: s('kor_common'), kor_elective: s('kor_elective'),
    math_sub: s('math_sub'), math_common: s('math_common'), math_elective: s('math_elective'), eng: s('eng'),
    inq1_sub: s('inq1_sub'), inq1: s('inq1'), inq2_sub: s('inq2_sub'), inq2: s('inq2'),
    fl_sub: s('fl_sub'), fl: s('fl')
  };
}

function validateStudent(v) {
  const errs = {};
  const need = (k, msg) => { if (!v[k]) errs[k] = msg; };
  const clsN = toInt(v.cls), numN = toInt(v.num);
  if (!v.cls) errs.cls = '반을 고르세요.';
  if (!numN || numN < 1) errs.info = '번호를 숫자로 입력하세요.';
  else if (!v.name) errs.info = '이름을 입력하세요.';
  if (!v.took) errs.took = '수능 응시 여부를 고르세요.';

  const score = (k, range, msg) => {
    const n = toInt(v[k]);
    if (n === null || !inRange(n, range)) errs[k] = msg;
    return n;
  };
  // 과목은 응시한 경우에만 입력한다. 칸을 하나라도 적었으면 그 과목의 나머지 칸도 맞게 채워야 하고, 모두 비우면 미응시다.
  const took = (keys) => keys.some((k) => v[k]);
  const korTook = took(['kor_sub', 'kor_common', 'kor_elective']);
  const mathTook = took(['math_sub', 'math_common', 'math_elective']);
  const engTook = took(['eng']);
  const histTook = took(['hist']);
  if (korTook) need('kor_sub', '선택과목을 고르세요.');
  if (mathTook) need('math_sub', '선택과목을 고르세요.');
  const korC = korTook ? score('kor_common', RANGE.korCommon, '0~76 사이 숫자') : null;
  const korE = korTook ? score('kor_elective', RANGE.korElective, '0~24 사이 숫자') : null;
  const mathC = mathTook ? score('math_common', RANGE.mathCommon, '0~74 사이 숫자') : null;
  const mathE = mathTook ? score('math_elective', RANGE.mathElective, '0~26 사이 숫자') : null;
  const eng = engTook ? score('eng', RANGE.eng, '0~100 사이 숫자') : null;
  const hist = histTook ? score('hist', RANGE.hist, '0~50 사이 숫자') : null;
  // 탐구는 응시한 과목만 입력한다. 과목이나 점수를 하나라도 적었으면 둘 다 맞아야 하고, 둘 다 비우면 응시하지 않은 것이다.
  const inqPair = (subKey, scoreKey) => {
    if (!v[subKey] && !v[scoreKey]) return null;
    if (!v[subKey]) errs[subKey] = '과목을 고르세요.';
    const n = score(scoreKey, RANGE.inq, '0~50 사이 숫자');
    return errs[scoreKey] ? null : n;
  };
  const inq1 = inqPair('inq1_sub', 'inq1');
  const inq2 = inqPair('inq2_sub', 'inq2');
  if (v.inq1_sub && v.inq2_sub && v.inq1_sub === v.inq2_sub) errs.inq = '탐구 과목 두 개는 서로 달라야 합니다.';

  // 제2외국어는 선택 사항: 과목이나 점수를 하나라도 적었으면 둘 다 맞아야 한다
  let fl = null;
  if (v.fl_sub || v.fl) {
    if (!v.fl_sub) errs.fl_sub = '과목을 고르세요.';
    const n = score('fl', RANGE.fl, '0~50 사이 숫자');
    if (!errs.fl) fl = n;
  }
  // 총점은 공통과 선택을 더한 값 (두 칸 중 하나라도 틀리면 총점은 비운다)
  const kor = korC !== null && korE !== null ? korC + korE : null;
  const math = mathC !== null && mathE !== null ? mathC + mathE : null;
  return { errs, values: {
    grade: 3, cls: clsN, num: numN, name: v.name, attended: v.took === 'yes', hist,
    kor_sub: v.kor_sub || '', kor_common: korC, kor_elective: korE, kor,
    math_sub: v.math_sub || '', math_common: mathC, math_elective: mathE, math,
    eng, inq1_sub: v.inq1_sub || '', inq1, inq2_sub: v.inq2_sub || '', inq2, fl_sub: v.fl_sub || '', fl } };
}

function showErrors(errs) {
  document.querySelectorAll('[data-err]').forEach((el) => { el.textContent = ''; });
  document.querySelectorAll('input.bad, select.bad').forEach((el) => el.classList.remove('bad'));
  Object.entries(errs).forEach(([k, msg]) => {
    const el = document.querySelector(`[data-err="${k}"]`);
    if (el) el.textContent = msg;
    const input = document.getElementById(k);
    if (input) input.classList.add('bad');
  });
  const first = Object.keys(errs)[0];
  if (first) {
    const target = document.getElementById(first) || document.querySelector(`[data-err="${first}"]`);
    if (target && target.focus) target.focus();
  }
}

async function submitStudent() {
  const status = document.getElementById('status');
  const submitBtn = document.getElementById('submit');
  const { errs, values } = validateStudent(readStudent());
  showErrors(errs);
  if (Object.keys(errs).length) { status.textContent = '빨간 칸을 확인하세요.'; return; }

  // 학년·반·번호·이름이 모두 같으면 같은 학생으로 보고 덮어쓴다. 문서 이름에 쓸 수 없는 '/'는 '_'로 바꾼다
  const id = `${values.grade}-${values.cls}-${values.num}-${values.name}`.replace(/\//g, '_');
  submitBtn.disabled = true;
  status.textContent = '저장하는 중...';
  try {
    const { fs, db } = await loadFirebase();
    await fs.setDoc(fs.doc(db, COLLECTION, id), { ...values, id, submittedAt: new Date().toISOString() });
    renderDone(values);
  } catch (err) {
    console.error(err);
    submitBtn.disabled = false;
    status.textContent = '저장하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.';
  }
}

function renderDone(v) {
  app.innerHTML = `
    <div class="card done">
      <p><strong>제출되었습니다.</strong></p>
      <p>${esc(v.cls)}반 ${esc(v.num)}번 ${esc(v.name)} 학생의 가채점 결과가 저장되었습니다.</p>
      <p class="hint">수정할 내용이 있으면 이 링크로 다시 들어와 처음부터 다시 제출하면 됩니다.</p>
      <button class="ghost" id="again">다시 입력</button>
    </div>`;
  document.getElementById('again').addEventListener('click', renderStudent);
}

// ---------------- 선생님 화면 ----------------
const SCHOOL_KEY = 'csatSchoolName';
function getSchoolName() {
  try { return localStorage.getItem(SCHOOL_KEY) || ''; } catch (e) { return ''; }
}
function setSchoolName(v) {
  try { localStorage.setItem(SCHOOL_KEY, v); } catch (e) { /* 저장 못 하면 그냥 넘어간다 */ }
}
const YEAR_KEY = 'csatYear';
function getYear() {
  try { return localStorage.getItem(YEAR_KEY) || '2026'; } catch (e) { return '2026'; }
}
function setYear(v) {
  try { localStorage.setItem(YEAR_KEY, v); } catch (e) { /* 저장 못 하면 그냥 넘어간다 */ }
}

// 교육청 양식 열 순서 그대로 (고등학교, 학년, 반, 번호, 이름, 한국사, 국어 영역, 국어 총점, 수학 영역, 수학 총점, 영어, 탐구1 과목, 탐구1 점수, 탐구2 과목, 탐구2 점수, 제2외국어 과목, 점수)
const EDU_HEADER = ['고등학교', '학년', '반', '번호', '이름', '한국사 원점수', '국어 영역', '국어 원점수총점', '수학 영역', '수학 원점수총점', '영어 원점수',
  '탐구영역1 과목명', '탐구영역1 원점수', '탐구영역2 과목명', '탐구영역2 원점수', '제2외국어 과목명', '제2외국어 원점수'];
// 대교협 양식 열 순서 그대로 (국어·수학은 공통과 선택 원점수를 따로 쓴다)
const KEDI_HEADER = ['학년도', '학년', '반', '번호', '이름', '한국사 원점수', '국어 영역', '국어 공통원점수', '국어 선택원점수',
  '수학 영역', '수학 공통원점수', '수학 선택원점수', '영어 원점수', '탐구영역1 과목명', '탐구영역1 원점수', '탐구영역2 과목명', '탐구영역2 원점수',
  '제2외국어 과목명', '제2외국어 원점수'];

function eduRow(r, school) {
  return [school, r.grade, r.cls, r.num, r.name, r.hist, r.kor_sub, r.kor, r.math_sub, r.math, r.eng,
    r.inq1_sub, r.inq1, r.inq2_sub, r.inq2, r.fl_sub || '', r.fl ?? ''];
}
function kediRow(r, year) {
  return [year, r.grade, r.cls, r.num, r.name, r.hist, kediName(r.kor_sub), r.kor_common, r.kor_elective,
    kediName(r.math_sub), r.math_common, r.math_elective, r.eng,
    kediName(r.inq1_sub), r.inq1, kediName(r.inq2_sub), r.inq2, kediName(r.fl_sub), r.fl ?? ''];
}

function sortRows(rows) {
  return rows.slice().sort((a, b) => (a.cls - b.cls) || (a.num - b.num));
}

function downloadWorkbook(header, rows, filename) {
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = header.map((h) => ({ wch: Math.max(8, h.length + 2) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '가채점');
  XLSX.writeFile(wb, filename);
}
const stampNow = () => new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');

function downloadEdu(rows) {
  const school = getSchoolName().trim();
  downloadWorkbook(EDU_HEADER, sortRows(rows).map((r) => eduRow(r, school)), `가채점_교육청_${school || '학교'}_${stampNow()}.xlsx`);
}
function downloadKedi(rows) {
  const year = getYear();
  downloadWorkbook(KEDI_HEADER, sortRows(rows).map((r) => kediRow(r, year)), `가채점_대교협_${year}_${stampNow()}.xlsx`);
}

// 선생님 로그인: 이메일과 비밀번호로 Firebase에 로그인한다 (학생 화면에는 영향 없음)
let stopWatch = null;
async function renderTeacher() {
  app.innerHTML = '<p class="sub">확인하는 중...</p>';
  let session;
  try {
    const fb = await loadFirebase();
    const am = await import(`${SDK}/firebase-auth.js`);
    session = { ...fb, am, auth: am.getAuth(fb.app) };
  } catch (err) {
    console.error(err);
    app.innerHTML = '<p class="sub">저장소에 연결하지 못했습니다.</p>';
    return;
  }
  session.am.onAuthStateChanged(session.auth, (user) => {
    if (user) renderTeacherDashboard(session);
    else renderTeacherLogin(session);
  });
}

function renderTeacherLogin(fb) {
  if (stopWatch) { stopWatch(); stopWatch = null; }
  app.classList.remove('wide');
  app.innerHTML = `
    <h1>수능 가채점 수합 (선생님)</h1>
    <p class="sub">선생님 계정으로 로그인하세요.</p>
    <section class="card">
      <form id="login" novalidate>
        <div><label for="email">이메일</label><input id="email" type="email" autocomplete="username"></div>
        <div style="margin-top:10px"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div>
        <div class="err" id="login-err"></div>
        <button type="submit" id="login-btn" style="margin-top:12px">로그인</button>
      </form>
    </section>`;
  document.getElementById('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-err');
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('pw').value;
    errEl.textContent = '';
    if (!email || !pw) { errEl.textContent = '이메일과 비밀번호를 입력하세요.'; return; }
    btn.disabled = true;
    try {
      await fb.am.signInWithEmailAndPassword(fb.auth, email, pw);
      // 로그인에 성공하면 onAuthStateChanged가 선생님 화면을 그린다
    } catch (err) {
      console.error(err);
      errEl.textContent = '로그인하지 못했습니다. 이메일과 비밀번호를 확인하세요.';
      btn.disabled = false;
    }
  });
}

// 반·번호 칸으로 제출 현황을 보여 준다. 1~8반, 각 반 1~30번 기준
const CLASS_COUNT = 8;
const NUM_MAX = 30;
function drawClassGrid(rows) {
  const box = document.getElementById('classGrid');
  if (!box) return;
  const byKey = new Map();
  rows.forEach((r) => byKey.set(`${r.cls}-${r.num}`, r));
  const outOfRange = rows.filter((r) => !(r.cls >= 1 && r.cls <= CLASS_COUNT && r.num >= 1 && r.num <= NUM_MAX)).length;
  let html = '';
  for (let c = 1; c <= CLASS_COUNT; c++) {
    const missing = [];
    let cells = '';
    for (let n = 1; n <= NUM_MAX; n++) {
      const r = byKey.get(`${c}-${n}`);
      if (!r) missing.push(n);
      const cls = !r ? 'cell' : (r.attended === false ? 'cell absent' : 'cell done');
      const title = r ? `${n}번 ${r.name}${r.attended === false ? ' (미응시)' : ''}` : `${n}번 미제출`;
      cells += `<span class="${cls}" title="${esc(title)}">${n}</span>`;
    }
    html += `<div class="class-row"><div class="class-label">${c}반 <span class="hint">미제출 ${missing.length}명</span></div>`
      + `<div class="cells">${cells}</div>`
      + (missing.length ? `<div class="hint">미제출 번호: ${missing.join(', ')}</div>` : '<div class="hint">모두 제출</div>')
      + '</div>';
  }
  html += '<p class="hint">초록: 제출 · 파랑: 미응시 · 회색: 미제출'
    + (outOfRange ? ` · 반·번호 범위를 벗어난 제출 ${outOfRange}건(목록에서 확인하세요)` : '') + '</p>';
  box.innerHTML = html;
}

function renderTeacherDashboard(fb) {
  if (stopWatch) { stopWatch(); stopWatch = null; }
  app.classList.add('wide');
  app.innerHTML = `
    <h1>수능 가채점 수합 (선생님)</h1>
    <div class="row-actions"><span class="status">선생님 계정으로 로그인됨</span><button class="ghost" id="logout">로그아웃</button></div>
    <p class="sub">학생이 제출한 결과를 실시간으로 보여 줍니다. 교육청용과 대교협용 엑셀을 따로 받을 수 있습니다.</p>
    <section class="card">
      <h2>학생에게 보낼 입력 링크</h2>
      <p class="hint"><a href="csat-collect.html" target="_blank" rel="noopener">학생용 입력 화면 열기</a> (학생에게는 이 주소를 보냅니다)</p>
    </section>
    <section class="card">
      <div class="grid">
        <div><label for="school">고등학교 이름 (교육청용 첫 열)</label><input id="school" value="${esc(getSchoolName())}" placeholder="예: 광주교육고등학교"></div>
        <div><label for="year">학년도 (대교협용 첫 열)</label><input id="year" value="${esc(getYear())}" inputmode="numeric"></div>
      </div>
    </section>
    <section class="card">
      <h2>반별 제출 현황</h2>
      <div id="classGrid"></div>
    </section>
    <section class="card">
      <div class="row-actions">
        <span class="status" id="count">불러오는 중...</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="dl-edu" disabled>교육청용 엑셀</button>
          <button id="dl-kedi" class="ghost" disabled>대교협용 엑셀</button>
        </div>
      </div>
      <div class="table-wrap" style="margin-top:12px">
        <table>
          <thead><tr><th>반</th><th>번호</th><th>이름</th><th>한국사</th><th>국어 과목</th><th>국어 공통</th><th>국어 선택</th><th>수학 과목</th><th>수학 공통</th><th>수학 선택</th><th>영어</th><th>탐구1</th><th>탐구2</th><th>제2외국어</th></tr></thead>
          <tbody id="rows"><tr><td colspan="14" class="hint">아직 제출된 내용이 없습니다.</td></tr></tbody>
        </table>
      </div>
    </section>`;

  let current = [];
  const school = document.getElementById('school');
  school.addEventListener('change', () => setSchoolName(school.value.trim()));
  const year = document.getElementById('year');
  year.addEventListener('change', () => setYear(year.value.trim()));
  const dlEdu = document.getElementById('dl-edu');
  const dlKedi = document.getElementById('dl-kedi');
  dlEdu.addEventListener('click', () => downloadEdu(current));
  dlKedi.addEventListener('click', () => downloadKedi(current));

  document.getElementById('logout').addEventListener('click', () => fb.am.signOut(fb.auth));
  const { fs, db } = fb;
  stopWatch = fs.onSnapshot(fs.collection(db, COLLECTION), (snap) => {
    current = snap.docs.map((d) => d.data());
    drawRows(current);
  }, (err) => {
    console.error(err);
    document.getElementById('count').textContent = '불러오지 못했습니다. 보안 규칙을 확인하세요.';
  });

  function drawRows(rows) {
    document.getElementById('count').textContent = `제출 ${rows.length}명`;
    drawClassGrid(rows);
    dlEdu.disabled = rows.length === 0;
    dlKedi.disabled = rows.length === 0;
    const body = document.getElementById('rows');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="14" class="hint">아직 제출된 내용이 없습니다.</td></tr>';
      return;
    }
    body.innerHTML = sortRows(rows).map((r) => `<tr>
      <td>${esc(r.cls)}</td><td>${esc(r.num)}</td><td>${esc(r.name)}${r.attended === false ? ' (미응시)' : ''}</td><td>${esc(r.hist)}</td>
      <td>${esc(r.kor_sub)}</td><td>${esc(r.kor_common)}</td><td>${esc(r.kor_elective)}</td>
      <td>${esc(r.math_sub)}</td><td>${esc(r.math_common)}</td><td>${esc(r.math_elective)}</td><td>${esc(r.eng)}</td>
      <td>${esc(r.inq1_sub)} ${esc(r.inq1)}</td><td>${esc(r.inq2_sub)} ${esc(r.inq2)}</td><td>${r.fl_sub ? esc(r.fl_sub) + ' ' + esc(r.fl) : ''}</td>
    </tr>`).join('');
  }
}

// ---------------- 시작 ----------------
if (isTeacher) renderTeacher();
else renderStudent();
</script>
