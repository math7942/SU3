<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티처블머신 소리 체험</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #eaf5f3; /* 메인 페이지와 동일한 배경색 */
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 { 
            color: #1e293b; 
            margin-top: 0; 
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        p { 
            color: #64748b; 
            line-height: 1.6; 
            word-break: keep-all; 
            margin-bottom: 30px;
        }

        button {
            background-color: #4b86f7;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(75, 134, 247, 0.2);
        }

        button:hover { 
            background-color: #3b76e7; 
            transform: translateY(-2px);
        }

        #label-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .label-item {
            background-color: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            color: #334155;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        /* 퍼센트를 시각적으로 보여주는 막대그래프 배경 */
        .progress-bar-bg {
            background-color: #e2e8f0;
            border-radius: 99px;
            height: 12px;
            width: 100%;
            overflow: hidden;
        }

        /* 퍼센트에 따라 채워지는 색상 막대 */
        .progress-bar-fill {
            background-color: #4b86f7;
            height: 100%;
            width: 0%; /* 처음에는 0% */
            transition: width 0.1s ease-out, background-color 0.2s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 삼각함수와 소리</h1>
        <p>우리가 듣는 소리는 공기의 진동으로 만들어지는 파동이며, 이는 수학적으로 <strong>삼각함수(Sine wave)</strong>로 나타낼 수 있습니다.<br>
        아래 버튼을 눌러 인공지능이 소리의 파동을 어떻게 구분하는지 직접 체험해 보세요!</p>
        
        <button type="button" onclick="init()">마이크 켜고 소리 인식 시작하기</button>
        <div id="label-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        // 🚨 중요: 아래 따옴표 안에 선생님이 티처블 머신에서 복사한 '공유 가능한 링크'를 반드시 붙여넣으세요! 🚨
        const URL = "https://teachablemachine.withgoogle.com/models/U1-s20ejq/";

        async function createModel() {
            const checkpointURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            const recognizer = speechCommands.create(
                "BROWSER_FFT", 
                undefined, 
                checkpointURL, 
                metadataURL
            );

            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            const button = document.querySelector('button');
            button.innerText = "AI 모델을 불러오는 중입니다...⏳";
            button.disabled = true;
            button.style.backgroundColor = "#94a3b8"; // 비활성화 색상

            try {
                const recognizer = await createModel();
                const classLabels = recognizer.wordLabels();
                const labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = ''; // 기존 내용 초기화

                // 인식할 소리의 종류(클래스)만큼 막대그래프 만들기
                for (let i = 0; i < classLabels.length; i++) {
                    const item = document.createElement("div");
                    item.className = "label-item";
                    
                    const labelText = document.createElement("span");
                    labelText.id = "text-" + i;
                    labelText.innerText = classLabels[i] + " (0%)";
                    
                    const progressBg = document.createElement("div");
                    progressBg.className = "progress-bar-bg";
                    
                    const progressFill = document.createElement("div");
                    progressFill.className = "progress-bar-fill";
                    progressFill.id = "progress-" + i;
                    
                    progressBg.appendChild(progressFill);
                    item.appendChild(labelText);
                    item.appendChild(progressBg);
                    labelContainer.appendChild(item);
                }

                button.innerText = "소리 듣는 중...🎤 (마이크 작동 중)";
                button.style.backgroundColor = "#10b981"; // 작동 중 초록색

                recognizer.listen(result => {
                    const scores = result.scores;
                    for (let i = 0; i < classLabels.length; i++) {
                        const percentValue = (scores[i] * 100).toFixed(0);
                        const percentText = percentValue + "%";
                        
                        // 텍스트 업데이트
                        document.getElementById("text-" + i).innerText = classLabels[i] + " (" + percentText + ")";
                        
                        // 막대그래프 길이 업데이트
                        const bar = document.getElementById("progress-" + i);
                        bar.style.width = percentText;
                        
                        // 확률이 70%를 넘으면 막대 색상을 주황색으로 강조
                        if (scores[i] > 0.7) {
                            bar.style.backgroundColor = "#f97316"; 
                        } else {
                            bar.style.backgroundColor = "#4b86f7"; 
                        }
                    }
                }, {
                    includeSpectrogram: true, // 소리를 시각적 데이터로 변환하여 분석
                    probabilityThreshold: 0.75,
                    invokeCallbackOnNoiseAndUnknown: true,
                    overlapFactor: 0.50 
                });
            } catch (error) {
                // 에러 발생 시 처리 (예: 마이크 권한 거부, 잘못된 URL 등)
                console.error(error);
                button.innerText = "마이크 권한을 허용해주세요! (또는 URL 확인)";
                button.style.backgroundColor = "#ef4444"; // 빨간색 에러 표시
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
