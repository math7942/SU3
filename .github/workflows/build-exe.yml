name: PDF 지우기 exe 만들기

on:
  push:
    branches: [claude/grade3-exam-range-collection-9494tj]
    paths:
      - 'desktop/**'
      - '03-work/pdf-privacy-eraser.html'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 필요한 패키지 설치
        working-directory: desktop
        run: npm install
      - name: exe 만들기
        working-directory: desktop
        run: npm run build:win
      - name: exe 올리기
        uses: actions/upload-artifact@v4
        with:
          name: PDF선택지우기-exe
          path: desktop/dist/*.exe
          if-no-files-found: error
